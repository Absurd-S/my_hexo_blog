<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的通勤之路 · SVG 2D 动画</title>
<style>
  :root{
    --txt:#e8f1f7; --dim:#93a9b8; --line:#24343f; --accent:#ffb703;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:28px 20px 34px;
    background:
      radial-gradient(1100px 560px at 50% -12%, #1d2f3d 0%, #0a1016 68%),
      #0a1016;
    color:var(--txt);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:min(1180px,100%)}

  .card{
    position:relative; border-radius:22px; overflow:hidden;
    box-shadow:0 34px 70px -26px rgba(0,0,0,.85), 0 0 0 1px var(--line);
  }
  #scene{display:block; width:100%; height:auto; background:#bfe6ff}

  .hud{
    position:absolute; top:16px; left:18px; display:flex; align-items:center; gap:10px;
    padding:9px 14px 9px 12px; border-radius:999px;
    background:rgba(10,20,28,.34); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.16); pointer-events:none;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,183,3,.22)}
  .hud b{font-size:14px; letter-spacing:.06em; font-weight:600}
  .hud span{font-size:10.5px; color:rgba(255,255,255,.62); letter-spacing:.16em}

  .chip{
    position:absolute; top:16px; right:18px; padding:9px 14px; border-radius:999px;
    background:rgba(10,20,28,.34); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.16);
    font-variant-numeric:tabular-nums; font-size:13px; letter-spacing:.04em; color:#fff; pointer-events:none;
  }
  .chip i{font-style:normal; color:rgba(255,255,255,.55); font-size:11px; margin-left:3px}

  .bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:11px 16px; border-radius:16px; background:#101b24; border:1px solid var(--line);
  }
  button{
    appearance:none; border:1px solid #2f4552; background:#16242f; color:var(--txt);
    font:inherit; font-size:13.5px; padding:7px 18px; border-radius:999px; cursor:pointer;
    transition:background .18s ease, border-color .18s ease, transform .12s ease;
  }
  button:hover{background:#1d3040; border-color:#3d5a6c}
  button:active{transform:translateY(1px)}
  .ctl{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim)}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:148px; height:4px; border-radius:3px;
    background:linear-gradient(90deg,#2f6f8f,#59b3c9); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:#fff; border:3px solid #2f7f9c; box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; background:#fff; border:3px solid #2f7f9c;
  }
  .val{font-variant-numeric:tabular-nums; min-width:44px; color:var(--txt); font-size:13px}
  .hint{margin-left:auto; font-size:12px; color:#6d8494}
  .hint kbd{
    font:inherit; font-size:11px; background:#1b2b36; border:1px solid #2b3f4c;
    border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:#a9c0cd;
  }
  .foot{font-size:12px; color:#63798a; letter-spacing:.02em}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <div class="hud"><span class="dot"></span><b>鹈鹕的通勤之路</b><span>COAST ROUTE</span></div>

    <button id="playBtn" type="button">暂停</button>
    <label class="ctl">速度
      <input id="speedRange" type="range" min="0.2" max="2.2" step="0.1" value="1">
      <span class="val" id="speedVal">1.0×</span>
    </label>
    <span class="hint"><kbd>空格</kbd> 播放 / 暂停</span>
  </div>
  <p class="foot">纯 SVG + 原生 JavaScript，无任何依赖；单文件可直接双击打开。</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;

  // —— 运动参数 ——
  const GROUND_SPD = 600;   // 地面滚动速度 px/s
  const CRANK_T    = 1.15;  // 曲柄一圈 (s)
  const WHEEL_T    = 0.82;  // 车轮一圈 (s)，≈ 2π·78 / GROUND_SPD，滚动不打滑
  const BBX = 662, BBY = 418, CR = 26;
  const THIGH = 92, SHIN = 94;
  const HIP_FAR  = { x: 612, y: 274 };
  const HIP_NEAR = { x: 640, y: 268 };

  // —— 节点缓存 ——
  const rider   = $('rider');
  const wheelR  = $('wheelRear'), wheelF = $('wheelFront');
  const crank   = $('crank'), pedalN = $('pedalN'), pedalF = $('pedalF');
  const legNearD = $('legNearD'), legNearC = $('legNearC'), footNear = $('footNear');
  const legFarD  = $('legFarD'),  legFarC  = $('legFarC'),  footFar  = $('footFar');
  const pouch = $('pouch'), crest = $('crest'), wingBar = $('wingBar');
  const eyeOpen = $('eyeOpen'), eyeShut = $('eyeShut');
  const scarf1 = $('scarf1'), scarf2 = $('scarf2');
  const drop = $('drop'), sunRays = $('sunRays');
  const dust = Array.from($('dust').children);
  const streaks = Array.from($('streaks').children);
  const layers = {
    hillsFar:  $('hillsFar'),  hillsNear: $('hillsNear'), trees: $('trees'),
    verge:     $('verge'),     blades:   $('blades'),   dashes: $('dashes'),
    fgGrass:   $('fgGrass')
  };
  const clouds = Array.from($('clouds').children).map(g => ({
    node: g, x: parseFloat(g.dataset.x || 0),
    y: parseFloat(g.dataset.y || 0), s: parseFloat(g.dataset.s || 1)
  }));
  const birds = Array.from($('birds').children).map(g => ({
    node: g, x: 300, y: 150, s: 1
  }));

  // 云 / 鸟 的初始位置（JS 生成，避免手写坐标）
  const cloudSeed = [[120, 78, 1.0], [430, 132, .78], [760, 60, 1.12], [1080, 152, .66], [180, 208, .6], [900, 210, .8]];
  const birdSeed  = [[300, 132, 1], [352, 154, .8], [268, 166, .66]];
  clouds.forEach((c, i) => { const s = cloudSeed[i % cloudSeed.length]; c.x = s[0]; c.y = s[1]; c.s = s[2]; });
  birds.forEach((b, i)  => { const s = birdSeed[i % birdSeed.length];  b.x = s[0]; b.y = s[1]; b.s = s[2]; });

  const TILE = 1200;
  const put = (node, x, y = 0) => node.setAttribute('transform', `translate(${x.toFixed(1)},${y})`);

  // —— 两连杆 IK：膝向前弯 ——
  function solveLeg(hx, hy, fx, fy, l1, l2) {
    let dx = fx - hx, dy = fy - hy;
    let d = Math.hypot(dx, dy) || 0.0001;
    const maxD = (l1 + l2) * 0.999;
    if (d > maxD) { const s = maxD / d; fx = hx + dx * s; fy = hy + dy * s; d = maxD; }
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / d, uy = dy / d;
    return { kx: hx + ux * a + uy * h, ky: hy + uy * a - ux * h, fx, fy };
  }

  // —— 飘带：按行波生成带厚度渐变的缎带（起点→终点可带倾角）——
  function ribbon(x0, y0, x1, y1, n, amp, k, freq, phase, w0, w1) {
    const up = [], dn = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const x = x0 + (x1 - x0) * u;
      const y = y0 + (y1 - y0) * u + amp * Math.pow(u, 0.7) * Math.sin(freq * t + phase - u * k);
      const w = (w0 + (w1 - w0) * u) * 0.5;
      up.push([x, y - w]); dn.push([x, y + w]);
    }
    let d = 'M' + up[0][0].toFixed(1) + ' ' + up[0][1].toFixed(1);
    for (let i = 1; i < up.length; i++) d += 'L' + up[i][0].toFixed(1) + ' ' + up[i][1].toFixed(1);
    for (let i = dn.length - 1; i >= 0; i--) d += 'L' + dn[i][0].toFixed(1) + ' ' + dn[i][1].toFixed(1);
    return d + 'Z';
  }

  // —— 主渲染 ——
  let t = 0;
  function render() {
    const a  = (t / CRANK_T) * TAU;          // 曲柄角
    const wa = ((t / WHEEL_T) % 1) * 360;   // 车轮角（度）
    const off = GROUND_SPD * t;

    // 视差滚动
    put(layers.hillsFar,  -((off * 0.16) % TILE));
    put(layers.hillsNear, -((off * 0.34) % TILE));
    put(layers.trees,     -((off * 0.55) % TILE));
    put(layers.verge,     -((off * 0.82) % TILE));
    put(layers.blades,    -((off * 0.88) % TILE));
    put(layers.dashes,    -((off * 1.00) % TILE));
    put(layers.fgGrass,   -((off * 1.45) % TILE));

    // 云 / 鸟
    const CW = 1560;
    clouds.forEach(c => {
      const x = ((c.x - off * 0.05) % CW + CW) % CW - 180;
      put(c.node, x, c.y);
      c.node.setAttribute('transform', `translate(${x.toFixed(1)},${c.y}) scale(${c.s})`);
    });
    birds.forEach((b, i) => {
      const x = ((b.x - off * 0.09 + Math.sin(t * 0.6 + i) * 26) % TILE + TILE) % TILE;
      const y = b.y + Math.sin(t * 0.8 + i * 2) * 7;
      b.node.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${b.s})`);
    });

    // 车身起伏：每半圈一次上下
    const bob  = -3.4 * Math.cos(2 * a);
    const roll = 0.75 * Math.sin(a);
    const jit  = 0.9 * Math.sin(t * 7.3) * Math.sin(t * 3.1);
    rider.setAttribute('transform', `translate(${jit.toFixed(2)},${bob.toFixed(2)}) rotate(${roll.toFixed(2)} 640 420)`);

    // 车轮 / 曲柄
    wheelR.setAttribute('transform', `rotate(${wa.toFixed(2)} 500 402)`);
    wheelF.setAttribute('transform', `rotate(${wa.toFixed(2)} 822 402)`);
    crank.setAttribute('transform', `rotate(${(a * 57.29578).toFixed(2)} ${BBX} ${BBY})`);
    pedalN.setAttribute('transform', `rotate(${(-a * 57.29578).toFixed(2)} 688 418)`);
    pedalF.setAttribute('transform', `rotate(${(-a * 57.29578).toFixed(2)} 636 418)`);

    // 腿：脚跟脚踏走
    const pa = { x: BBX + CR * Math.cos(a),     y: BBY + CR * Math.sin(a) };
    const pb = { x: BBX - CR * Math.cos(a),     y: BBY - CR * Math.sin(a) };
    const near = solveLeg(HIP_NEAR.x, HIP_NEAR.y, pa.x, pa.y, THIGH, SHIN);
    const far  = solveLeg(HIP_FAR.x,  HIP_FAR.y,  pb.x, pb.y, THIGH, SHIN);

    const dn = `M${HIP_NEAR.x} ${HIP_NEAR.y}L${near.kx.toFixed(1)} ${near.ky.toFixed(1)}L${near.fx.toFixed(1)} ${near.fy.toFixed(1)}`;
    const df = `M${HIP_FAR.x} ${HIP_FAR.y}L${far.kx.toFixed(1)} ${far.ky.toFixed(1)}L${far.fx.toFixed(1)} ${far.fy.toFixed(1)}`;
    legNearD.setAttribute('d', dn); legNearC.setAttribute('d', dn);
    legFarD.setAttribute('d', df);  legFarC.setAttribute('d', df);
    put(footNear, near.fx - 12, near.fy - 3.5);
    put(footFar,  far.fx - 11,  far.fy - 3.5);

    // 鹈鹕细节
    pouch.setAttribute('transform', `rotate(${(2.4 * Math.sin(a + .6) + 1.3 * Math.sin(t * 3.3)).toFixed(2)} 752 136)`);
    crest.setAttribute('transform', `rotate(${(2.6 * Math.sin(a)).toFixed(2)} 706 104)`);
    wingBar.setAttribute('transform', `rotate(${(1.8 * Math.sin(a + 1.2)).toFixed(2)} 664 214)`);

    // 眨眼
    const bl = t % 3.9;
    let lid = 0;
    if (bl < 0.07) lid = bl / 0.07;
    else if (bl < 0.13) lid = 1;
    else if (bl < 0.24) lid = 1 - (bl - 0.13) / 0.11;
    eyeOpen.setAttribute('opacity', (1 - lid).toFixed(2));
    eyeShut.setAttribute('opacity', lid.toFixed(2));

    // 围巾：两条带子都顺风往后飘
    scarf1.setAttribute('d', ribbon(654, 212, 452, 172, 24, 15, 5.4, 4.2, 0.0, 15, 1.5));
    scarf2.setAttribute('d', ribbon(646, 226, 500, 196, 20, 10, 4.6, 4.2, 2.1, 11, 1.5));

    // 尘土
    for (let i = 0; i < dust.length; i++) {
      const q = (t / 0.62 + i / 3) % 1;
      dust[i].setAttribute('cx', (496 - 54 * q - 4 * i).toFixed(1));
      dust[i].setAttribute('cy', (470 - 30 * q * q).toFixed(1));
      dust[i].setAttribute('r', (6 + 16 * q).toFixed(1));
      dust[i].setAttribute('opacity', (0.3 * (1 - q) * (1 - q)).toFixed(3));
    }

    // 速度线
    streaks.forEach((s, i) => {
      const x = 470 - ((off * 1.15 + i * 190) % 520);
      s.setAttribute('transform', `translate(${x.toFixed(1)},0)`);
      s.setAttribute('opacity', (0.14 + 0.2 * Math.abs(Math.sin(t * 2.2 + i))).toFixed(2));
    });

    // 太阳光芒 + 汗珠
    sunRays.setAttribute('transform', `rotate(${(t * 5) % 360} 1000 92)`);
    const p = ((t + 1.3) % 2.6) / 2.6;
    if (p < 0.46) {
      const k = p / 0.46;
      drop.setAttribute('opacity', (Math.min(1, k * 4) * (1 - k)).toFixed(3));
      drop.setAttribute('transform', `translate(${(766 + 20 * k).toFixed(1)},${(88 + 210 * k * k).toFixed(1)})`);
    } else {
      drop.setAttribute('opacity', '0');
    }

    // 速度表
    if (kmh) kmh.textContent = (19 * speed * (1 + 0.045 * Math.sin(t * 2.3) + 0.025 * Math.sin(t * 5.7))).toFixed(1);
  }

  // —— 播放控制 ——
  const kmh = $('kmh');
  const playBtn = $('playBtn');
  const speedRange = $('speedRange');
  const speedVal = $('speedVal');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let running = !reduced, speed = 1, last = performance.now();

  playBtn.textContent = running ? '暂停' : '播放';
  playBtn.addEventListener('click', () => {
    running = !running;
    playBtn.textContent = running ? '暂停' : '播放';
  });
  speedRange.addEventListener('input', () => {
    speed = parseFloat(speedRange.value);
    speedVal.textContent = speed.toFixed(1) + '×';
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      running = !running;
      playBtn.textContent = running ? '暂停' : '播放';
    }
  });

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) t += dt * speed;
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
