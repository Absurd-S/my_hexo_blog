<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#008080">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="扫雷 · Windows 98 复古风格，单文件 H5">
<title>扫雷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23c0c0c0'/><g stroke='%23000' stroke-width='1.3' stroke-linecap='round'><path d='M8 1v3M8 12v3M1 8h3M12 8h3M3.2 3.2l2 2M10.8 10.8l2 2M12.8 3.2l-2 2M5.2 10.8l-2 2'/></g><circle cx='8' cy='8' r='4.3' fill='%23000'/><circle cx='6.3' cy='6.3' r='1.3' fill='%23fff'/></svg>">
<style>
/* ============================================================
   扫雷 — 单文件 H5
   视觉：Windows 98 桌面
   整个页面就是一个 96dpi 的 Win98 桌面：抖动青底 + 带斜面阴影的窗口 +
   任务栏 + 开始菜单 + 关机屏。扫雷本体照搬 1998 年那版：银灰面板、
   2px 双层斜面方块、黑底红字 LED 计数器、黄脸按钮。
   斜面阴影（out / in）是这台机器唯一的物理法则，窗口、按钮、菜单、
   输入框、格子全都从它派生。
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* Win98 系统色 */
  --face:    #c0c0c0;   /* ButtonFace / 银灰 */
  --face-lt: #dfdfdf;   /* ButtonLight */
  --hilite:  #ffffff;   /* ButtonHighlight */
  --shadow:  #808080;   /* ButtonShadow */
  --dk:      #000000;   /* ButtonDkShadow */
  --desk:    #008080;   /* 桌面青 */

  /* 标题栏渐变（Win98「Windows 标准」方案） */
  --tt1: #000082;  --tt2: #1084d0;
  --ti1: #808080;  --ti2: #b5b5b5;

  /* LED 计数器 */
  --lcd:     #000000;
  --lcd-on:  #ff2a2a;
  --lcd-off: #3a0a0a;

  --ui: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Verdana, Geneva,
        "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "Lucida Console", "Courier New", monospace;

  --cell: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html, body {
  margin: 0; padding: 0; height: 100%;
  overflow: hidden; overscroll-behavior: none;
}

body {
  font: 11px/1.45 var(--ui);
  color: var(--dk);
  background-color: var(--desk);
  /* 98 桌面不是纯色，是双色抖动 */
  background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,.20) 1px, rgba(0,0,0,0) 1.4px);
  background-size: 2px 2px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: default;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }

/* ---------- 2px 双层斜面：全站唯一的物理法则 ---------- */
.out   { box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--dk),
                    inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--shadow); }
.in    { box-shadow: inset  1px  1px 0 var(--dk),      inset -1px -1px 0 var(--hilite),
                    inset  2px  2px 0 var(--shadow),  inset -2px -2px 0 var(--face-lt); }
.out1  { box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--shadow); }
.in1   { box-shadow: inset  1px  1px 0 var(--shadow), inset -1px -1px 0 var(--hilite); }

/* ---------- 通用 Win98 按钮 ---------- */
.w98 {
  background: var(--face);
  border: 0; padding: 3px 10px;
  box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--dk),
              inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--shadow);
}
.w98:active, .w98.dn {
  box-shadow: inset  1px  1px 0 var(--dk),     inset -1px -1px 0 var(--hilite),
              inset  2px  2px 0 var(--shadow), inset -2px -2px 0 var(--face-lt);
  padding: 4px 9px 2px 11px;
}
.w98:focus-visible { outline: 1px dotted var(--dk); outline-offset: -5px; }

/* ---------- 桌面 ---------- */
#desktop { position: fixed; inset: 0; bottom: calc(28px + var(--safe-b)); }

.shortcut {
  position: absolute; top: 10px; left: 12px;
  width: 74px; padding: 5px 2px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: 0; text-align: center;
}
.shortcut img, .shortcut svg { width: 32px; height: 32px; }
.shortcut span {
  color: #fff; padding: 1px 3px; line-height: 1.25;
  text-shadow: 1px 1px 0 rgba(0,0,0,.75);
}
.shortcut.sel span { background: var(--tt1); text-shadow: none; }
.shortcut.sel svg { filter: drop-shadow(0 0 0 #000080); }

/* ---------- 窗口 ---------- */
#win {
  position: absolute; left: 50%; top: 50%;
  background: var(--face);
  padding: 3px;
  border: 1px solid;
  border-color: var(--hilite) var(--dk) var(--dk) var(--hilite);
  box-shadow: inset 1px 1px 0 var(--face-lt), inset -1px -1px 0 var(--shadow),
              2px 3px 10px rgba(0,0,0,.45);
  min-width: 190px;
  /* 兜底：无论 fit() 跑没跑，窗口都不许撑出视口 */
  max-width: calc(100vw - 6px);
}
#win.max {
  left: 0 !important; top: 0 !important;
  width: 100% !important; height: 100% !important;
  border-width: 2px;
  box-shadow: none;
}
#win.min { display: none; }

.titlebar {
  display: flex; align-items: center; gap: 4px;
  height: 18px; padding: 0 2px 0 3px;
  background: linear-gradient(90deg, var(--tt1), var(--tt2));
  color: #fff; font-weight: 700;
  cursor: default;
}
.titlebar.inactive { background: linear-gradient(90deg, var(--ti1), var(--ti2)); color: var(--shadow); }
.titlebar > svg { width: 16px; height: 16px; flex: none; }
.titlebar .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tbtns { display: flex; gap: 2px; flex: none; }
.tbtn {
  width: 16px; height: 14px; padding: 0; background: var(--face); border: 0;
  box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--dk),
              inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--shadow);
  position: relative; display: grid; place-items: center;
}
.tbtn:active { box-shadow: inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--hilite),
                             inset 2px 2px 0 var(--shadow), inset -2px -2px 0 var(--face-lt); }
.tbtn i { position: absolute; background: var(--dk); }
/* 三个按钮的图形全是 98 原版那样「画」出来的，不用字体字形 */
.tbtn.min i { width: 6px; height: 2px; left: 5px; top: 8px; }
.tbtn.max i { width: 8px; height: 7px; left: 4px; top: 3px; background: none;
              border: 1px solid var(--dk); border-top-width: 2px; }
.tbtn.close i { width: 8px; height: 1.6px; left: 4px; top: 6.2px;
                transform: rotate(45deg); box-shadow: 0 0 0 0 var(--dk); }
.tbtn.close i:last-child { transform: rotate(-45deg); }

/* ---------- 菜单栏 ---------- */
.menubar { display: flex; padding: 1px 0 2px; position: relative; }
.menubar > button { background: none; border: 0; padding: 2px 7px; }
.menubar > button.open,
body.menu-open .menubar > button:hover { background: var(--tt1); color: #fff; }

.menu {
  position: fixed; z-index: 70; min-width: 168px;
  background: var(--face); padding: 1px;
  box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--dk),
              inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--shadow),
              2px 2px 4px rgba(0,0,0,.4);
}
.mi { display: flex; align-items: center; gap: 12px; padding: 3px 20px 3px 24px; position: relative; white-space: nowrap; }
.mi:hover { background: var(--tt1); color: #fff; }
.mi.dis { color: var(--shadow); text-shadow: 1px 1px 0 var(--hilite); }
.mi.dis:hover { background: none; color: var(--shadow); }
.mi .acc { margin-left: auto; padding-left: 18px; }
.mi .mk { position: absolute; left: 7px; font-weight: 700; }
.msep { height: 0; margin: 3px 1px; border-top: 1px solid var(--shadow); border-bottom: 1px solid var(--hilite); }

/* ---------- 扫雷面板 ---------- */
.client { padding: 2px 2px 0; }

.hud { display: flex; align-items: center; justify-content: space-between; padding: 4px 5px; }

.lcd {
  background: var(--lcd); padding: 3px 4px;
  box-shadow: inset 1px 1px 0 #5a5a5a, inset -1px -1px 0 var(--hilite);
}
.digits { display: flex; gap: 3px; }
.n7 { position: relative; width: 9px; height: 16px; }
.n7__s { position: absolute; background: var(--lcd-off); border-radius: .5px; }
.n7__s.on { background: var(--lcd-on); box-shadow: 0 0 3px rgba(255,42,42,.75); }
.n7__s--a { left: 1px; top: 0;    width: 7px; height: 2px; }
.n7__s--b { left: 7px; top: 1px;  width: 2px; height: 6px; }
.n7__s--c { left: 7px; top: 9px;  width: 2px; height: 6px; }
.n7__s--d { left: 1px; top: 14px; width: 7px; height: 2px; }
.n7__s--e { left: 0px; top: 9px;  width: 2px; height: 6px; }
.n7__s--f { left: 0px; top: 1px;  width: 2px; height: 6px; }
.n7__s--g { left: 1px; top: 7px;  width: 7px; height: 2px; }

.facebtn {
  width: 28px; height: 28px; padding: 0; background: var(--face); border: 0;
  box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--dk),
              inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--shadow);
  display: grid; place-items: center;
}
.facebtn:active { box-shadow: inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--hilite),
                              inset 2px 2px 0 var(--shadow), inset -2px -2px 0 var(--face-lt); }
.facebtn svg { width: 24px; height: 24px; }

.frame {
  padding: 3px;
  box-shadow: inset  1px  1px 0 var(--shadow), inset -1px -1px 0 var(--hilite),
              inset  2px  2px 0 var(--dk),      inset -2px -2px 0 var(--face-lt);
}
.board {
  display: grid; grid-template-columns: repeat(var(--cols), var(--cell));
  background: var(--face); touch-action: manipulation;
}
.c {
  width: var(--cell); height: var(--cell);
  display: grid; place-items: center;
  font-weight: 700; font-size: calc(var(--cell) * .68); line-height: 1;
}
.c.cov { box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--shadow),
                    inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--dk); }
.c.cov.dn { box-shadow: inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--hilite),
                     inset 2px 2px 0 var(--shadow), inset -2px -2px 0 var(--face-lt); }
.c.opn { background: var(--face); box-shadow: inset 1px 1px 0 #d5d5d5; }
.c.hit { background: #ff0000; box-shadow: inset 1px 1px 0 #d5d5d5; }
.c > svg { width: 82%; height: 82%; display: block; }
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}
.n5{color:#800000}.n6{color:#008080}.n7{color:#000000}.n8{color:#808080}
.q { color: #000080; }

/* 状态栏 */
.statusbar { display: flex; gap: 2px; margin: 4px 0 3px; }
.statusbar > div {
  padding: 2px 5px; box-shadow: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--hilite);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#stInfo { flex: 0 0 auto; }
#stTip  { flex: 1; color: #404040; }
#stTip b { color: var(--dk); font-weight: 400; }

/* 触屏专用开关，鼠标环境不显示 */
.touch-only { display: none; align-items: center; gap: 4px; margin: 3px 0 0; justify-content: flex-end; }
.tgl { display: flex; align-items: center; gap: 4px; padding: 2px 7px; }
.tgl svg { width: 11px; height: 11px; }
.tgl.on { box-shadow: inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--hilite),
                    inset 2px 2px 0 var(--shadow), inset -2px -2px 0 var(--face-lt);
          background: #b4b4b4; }
@media (hover: none), (pointer: coarse) { .touch-only { display: flex; } }

/* ---------- 任务栏 ---------- */
.taskbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  height: calc(28px + var(--safe-b)); padding: 2px 2px var(--safe-b);
  background: var(--face); display: flex; align-items: center; gap: 3px;
  box-shadow: inset 0 1px 0 var(--hilite), inset 0 2px 0 var(--face-lt);
}
#startBtn { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 3px; flex: none; }
#startBtn svg { width: 16px; height: 16px; }
.tasks { flex: 1; display: flex; gap: 3px; min-width: 0; padding-left: 2px; }
.task {
  display: flex; align-items: center; gap: 4px; max-width: 168px;
  padding: 2px 8px; background: var(--face); border: 0; overflow: hidden;
  box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--dk),
              inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--shadow);
}
.task:active, .task.act { box-shadow: inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--hilite),
                                        inset 2px 2px 0 var(--shadow), inset -2px -2px 0 var(--face-lt); }
.task span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.task svg { width: 14px; height: 14px; flex: none; }
.tray {
  flex: none; display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 4px;
  box-shadow: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--hilite);
}
#traySound { background: none; border: 0; padding: 0 2px; display: grid; place-items: center; opacity: .8; }
#traySound svg { width: 13px; height: 13px; }
#clock { min-width: 46px; text-align: center; }

/* ---------- 开始菜单 ---------- */
.startmenu {
  position: fixed; z-index: 80; left: 2px;   /* top 由脚本贴着任务栏顶边算 */
  display: flex; background: var(--face); padding: 2px;
  box-shadow: inset  1px  1px 0 var(--hilite), inset -1px -1px 0 var(--dk),
              inset  2px  2px 0 var(--face-lt), inset -2px -2px 0 var(--shadow),
              2px -2px 6px rgba(0,0,0,.4);
}
.startmenu .spine {
  width: 21px; background: linear-gradient(0deg, var(--tt1), var(--tt2));
  display: grid; place-items: center;
}
.startmenu .spine b {
  writing-mode: vertical-rl; transform: rotate(180deg);
  color: #fff; font-size: 15px; letter-spacing: .5px; font-weight: 700;
}
.startmenu .items { min-width: 168px; }
.startmenu .mi { padding: 5px 18px 5px 22px; gap: 10px; }
.startmenu .mi svg { width: 22px; height: 22px; flex: none; margin-left: -18px; }
.startmenu .mi .lab { flex: 1; }
.startmenu .mi .arr { margin-left: auto; padding-left: 14px; font-size: 9px; }

/* ---------- 对话框 ---------- */
#modal { position: fixed; inset: 0; z-index: 90; display: none; }
#modal.on { display: block; }
.dlg {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
  min-width: 232px; max-width: min(92vw, 460px);
  background: var(--face); padding: 3px;
  border: 1px solid; border-color: var(--hilite) var(--dk) var(--dk) var(--hilite);
  box-shadow: inset 1px 1px 0 var(--face-lt), inset -1px -1px 0 var(--shadow),
              3px 4px 14px rgba(0,0,0,.5);
}
.dlg .body { padding: 12px 12px 10px; display: flex; gap: 12px; }
.dlg .body > svg { width: 32px; height: 32px; flex: none; }
.dlg .body p { margin: 0 0 8px; }
.dlg .body p:last-child { margin-bottom: 0; }
.dlg .foot { display: flex; justify-content: flex-end; gap: 6px; padding: 0 12px 12px; }
kbd {
  display: inline-block; padding: 0 4px; background: var(--face);
  box-shadow: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--hilite);
  font: 11px var(--ui);
}
.tbl { border-collapse: collapse; }
.tbl td { padding: 2px 8px; box-shadow: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--hilite); }
.tbl td.k { color: #000080; }

/* ---------- 关机屏 ---------- */
#off {
  position: fixed; inset: 0; z-index: 120; display: none;
  background: #000; color: #fc0; font: 15px/1.7 var(--mono);
  place-content: center; justify-items: center; gap: 18px; text-align: center; padding: 20px;
}
#off.on { display: grid; }
#off .box { border: 2px solid #fc0; padding: 14px 30px; }
#off .btns { display: flex; gap: 10px; }
#off .w98 { color: var(--dk); }

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ================= 桌面 ================= -->
<div id="desktop">
  <button class="shortcut" id="deskIcon" title="扫雷">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" fill="#c0c0c0" stroke="#000"/>
      <g stroke="#000" stroke-width="1.6" stroke-linecap="round">
        <path d="M16 5v5M16 22v5M5 16h5M22 16h5M8 8l3.4 3.4M20.6 20.6L24 24M24 8l-3.4 3.4M11.4 20.6L8 24"/>
      </g>
      <circle cx="16" cy="16" r="7" fill="#000"/>
      <circle cx="13.2" cy="13.2" r="2.1" fill="#fff"/>
    </svg>
    <span>扫雷</span>
  </button>

  <!-- ================= 窗口 ================= -->
  <div id="win" role="dialog" aria-label="扫雷">
    <div class="titlebar" id="titlebar">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <g stroke="#fff" stroke-width="1.3" stroke-linecap="round">
          <path d="M8 1v3M8 12v3M1 8h3M12 8h3M3.2 3.2l2 2M10.8 10.8l2 2M12.8 3.2l-2 2M5.2 10.8l-2 2"/>
        </g>
        <circle cx="8" cy="8" r="4.3" fill="#fff"/><circle cx="6.3" cy="6.3" r="1.3" fill="#000080"/>
      </svg>
      <span class="t">扫雷</span>
      <span class="tbtns">
        <button class="tbtn min"  data-win="min"  title="最小化"><i></i></button>
        <button class="tbtn max"  data-win="max"  title="最大化"><i></i></button>
        <button class="tbtn close" data-win="close" title="关闭"><i></i><i></i></button>
      </span>
    </div>

    <div class="menubar" id="menubar">
      <button data-menu="game">游戏(G)</button>
      <button data-menu="help">帮助(H)</button>
    </div>

    <div class="client">
      <div class="hud">
        <div class="lcd"><div class="digits" id="lcdMines"></div></div>
        <button class="facebtn" id="faceBtn" title="新游戏"></button>
        <div class="lcd"><div class="digits" id="lcdTime"></div></div>
      </div>

      <div class="frame">
        <div class="board" id="board" tabindex="0" aria-label="雷区"></div>
      </div>

      <div class="touch-only">
        <button class="w98 tgl" id="flagModeBtn" title="开启后单击即标旗">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 14.5h8M6 14.5V2" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M6 2.2 12.4 5 6 7.6z" fill="#f00" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
          </svg>
          <span>标旗模式</span>
        </button>
      </div>

      <div class="statusbar">
        <div id="stInfo">初级</div>
        <div id="stTip"></div>
      </div>
    </div>
  </div>
</div>

<!-- ================= 任务栏 ================= -->
<div class="taskbar">
  <button class="w98" id="startBtn">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M1 2.4 7.4 1.6v6.1H1z" fill="#f44"/>
      <path d="M8.4 1.5 15 2.3v5.4H8.4z" fill="#4c4"/>
      <path d="M1 8.6h6.4v6.1L1 13.9z" fill="#48f"/>
      <path d="M8.4 8.6H15v5.3l-6.6.8z" fill="#ff4"/>
    </svg>
    <b>开始</b>
  </button>
  <div class="tasks" id="tasks">
    <button class="task act" id="taskWin">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="1" width="14" height="14" fill="#c0c0c0" stroke="#000"/>
        <g stroke="#000" stroke-width="1.1" stroke-linecap="round">
          <path d="M8 3v2.4M8 10.6V13M3 8h2.4M10.6 8H13M4.4 4.4l1.7 1.7M9.9 9.9l1.7 1.7M11.6 4.4 9.9 6.1M6.1 9.9 4.4 11.6"/>
        </g><circle cx="8" cy="8" r="3.2" fill="#000"/>
      </svg>
      <span>扫雷</span>
    </button>
  </div>
  <div class="tray">
    <button id="traySound" title="音效"></button>
    <span id="clock">--:--</span>
  </div>
</div>

<!-- ================= 模态 ================= -->
<div id="modal"></div>
<div id="off">
  <div class="box" id="offBox">
    <div>C:\WINDOWS\系统\</div>
    <div>现在可以安全地关闭计算机了。</div>
  </div>
  <div class="btns" id="offBtns"></div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 图标
     ========================================================= */
  var SVG_MINE =
    '<svg viewBox="0 0 16 16" aria-hidden="true">' +
    '<g stroke="#000" stroke-width="1.2" stroke-linecap="round">' +
    '<path d="M8 1v3M8 12v3M1 8h3M12 8h3M3.2 3.2l2 2M10.8 10.8l2 2M12.8 3.2l-2 2M5.2 10.8l-2 2"/>' +
    '</g><circle cx="8" cy="8" r="4.3" fill="#000"/><circle cx="6.3" cy="6.3" r="1.3" fill="#fff"/></svg>';

  var SVG_FLAG =
    '<svg viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M3.5 14.2h7.5" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>' +
    '<path d="M6.2 14V1.8" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>' +
    '<path d="M6.4 2.1 12.6 4.8 6.4 7.4z" fill="#f00" stroke="#000" stroke-width="1" stroke-linejoin="round"/>' +
    '</svg>';

  var SVG_WRONG =
    '<svg viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M3.5 14.2h7.5" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>' +
    '<path d="M6.2 14V1.8" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>' +
    '<path d="M6.4 2.1 12.6 4.8 6.4 7.4z" fill="#f00" stroke="#000" stroke-width="1" stroke-linejoin="round"/>' +
    '<path d="M2.6 2.6 13.4 13.4M13.4 2.6 2.6 13.4" stroke="#f00" stroke-width="1.7" stroke-linecap="round"/>' +
    '</svg>';

  var SVG_Q = '<span class="q">?</span>';

  // 98 版的脸：0 笑 1 哦 2 死 3 墨镜胜
  function faceSVG(kind) {
    var eyeDot = '<circle cx="11" cy="12.5" r="1.9" fill="#000"/><circle cx="21" cy="12.5" r="1.9" fill="#000"/>';
    var mouth;
    if (kind === 0) mouth = '<path d="M9 18.5a7.5 7.5 0 0 0 14 0" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round"/>';
    else if (kind === 1) {
      eyeDot = '<circle cx="11" cy="12" r="2.8" fill="#fff" stroke="#000" stroke-width="1.3"/>' +
               '<circle cx="21" cy="12" r="2.8" fill="#fff" stroke="#000" stroke-width="1.3"/>';
      mouth = '<ellipse cx="16" cy="20.5" rx="3" ry="4" fill="#000"/>';
    } else if (kind === 2) {
      var x = '<path d="M9.2 10.7 12.8 14.3M12.8 10.7 9.2 14.3M19.2 10.7 22.8 14.3M22.8 10.7 19.2 14.3" stroke="#000" stroke-width="1.6" stroke-linecap="round" fill="none"/>';
      eyeDot = x;
      mouth = '<path d="M9 23a7.5 7.5 0 0 1 14 0" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round"/>';
    } else {
      eyeDot = '<g fill="#000"><rect x="5.6" y="9.4" width="9.4" height="6" rx="1.6"/>' +
               '<rect x="17" y="9.4" width="9.4" height="6" rx="1.6"/></g>' +
               '<path d="M14.9 11.4h2.2" stroke="#000" stroke-width="1.5"/>' +
               '<path d="M5.6 10.6 3.4 9.4M26.4 10.6 28.6 9.4" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>';
      mouth = '<path d="M10 20.5a6.5 6.5 0 0 0 12 0" fill="none" stroke="#000" stroke-width="1.9" stroke-linecap="round"/>';
    }
    return '<svg viewBox="0 0 32 32" aria-hidden="true">' +
      '<circle cx="16" cy="16" r="14" fill="#ffff00" stroke="#000" stroke-width="1.5"/>' +
      eyeDot + mouth + '</svg>';
  }

  /* =========================================================
     2. 音效（WebAudio 合成，零外部请求）
     ========================================================= */
  var AC = null, soundOn = true;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(freq, dur, type, gain, slideTo) {
    if (!soundOn) return;
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.05, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  function noise(dur, gain) {
    if (!soundOn) return;
    var c = ac(); if (!c) return;
    var n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = c.createBufferSource(); s.buffer = buf;
    var g = c.createGain(); g.gain.value = gain || 0.09;
    s.connect(g); g.connect(c.destination); s.start();
  }
  var SFX = {
    dig:  function () { tone(520, 0.035, 'square', 0.028); },
    flag: function () { tone(180, 0.05, 'triangle', 0.05, 260); },
    boom: function () { noise(0.55, 0.14); tone(90, 0.5, 'sawtooth', 0.07, 34); },
    win:  function () { var t = 0; [523, 659, 784, 1047].forEach(function (f) { setTimeout(function () { tone(f, 0.11, 'square', 0.05); }, t); t += 92; }); }
  };

  /* =========================================================
     3. 难度与状态
     ========================================================= */
  var DIFFS = {
    beginner:     { name: '初级', w: 9,  h: 9,  m: 10, menu: '初级(B)' },
    intermediate: { name: '中级', w: 16, h: 16, m: 40, menu: '中级(I)' },
    expert:       { name: '高级', w: 30, h: 16, m: 99, menu: '高级(E)' }
  };
  var BEST_KEY = 'ms98.best.';

  var MINE = 9;
  var S_COV = 0, S_OPEN = 1, S_FLAG = 2, S_Q = 3, S_WRONG = 4, S_HIT = 5;

  var diff = 'beginner', W = 9, H = 9, MINES = 10;
  var grid = null, st = null;
  var started = false, over = false, won = false, markMode = true, flagMode = false;
  var flags = 0, opened = 0, tSec = 0, timer = null, face = 0;
  var cellEls = [], pressed = -1;

  var $ = function (id) { return document.getElementById(id); };
  var board = $('board'), win = $('win'), faceBtn = $('faceBtn');

  /* =========================================================
     4. LED 数码管
     ========================================================= */
  var SEG = { '0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg',
              '5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':'' };

  function makeDigits(host) {
    host.innerHTML = '';
    var out = [];
    for (var d = 0; d < 3; d++) {
      var wrap = document.createElement('div'); wrap.className = 'n7';
      var segs = [];
      for (var s = 0; s < 7; s++) {
        var el = document.createElement('i');
        el.className = 'n7__s n7__s--' + 'abcdefg'[s];
        wrap.appendChild(el); segs.push(el);
      }
      host.appendChild(wrap); out.push(segs);
    }
    return out;
  }
  var digMines = makeDigits($('lcdMines'));
  var digTime  = makeDigits($('lcdTime'));

  function setDigits(digs, str) {
    while (str.length < 3) str = ' ' + str;
    str = str.slice(-3);
    for (var d = 0; d < 3; d++) {
      var on = SEG[str[d]] || '';
      for (var s = 0; s < 7; s++) digs[d][s].classList.toggle('on', on.indexOf('abcdefg'[s]) >= 0);
    }
  }
  function fmtMines(n) { return n < 0 ? '-' + ('0' + (-n)).slice(-2) : ('00' + n).slice(-3); }
  function fmtTime(n) { return ('00' + Math.min(n, 999)).slice(-3); }

  /* =========================================================
     5. 棋盘
     ========================================================= */
  function nbrs(i) {
    var x = i % W, y = (i / W) | 0, r = [];
    for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      var nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      r.push(ny * W + nx);
    }
    return r;
  }

  function buildBoard() {
    var D = DIFFS[diff]; W = D.w; H = D.h; MINES = D.m;
    board.style.setProperty('--cols', W);
    board.innerHTML = ''; cellEls = [];
    var frag = document.createDocumentFragment();
    for (var i = 0; i < W * H; i++) {
      var c = document.createElement('div');
      c.className = 'c cov'; c.dataset.i = i;
      frag.appendChild(c); cellEls.push(c);
    }
    board.appendChild(frag);
  }

  function newGame() {
    grid = new Uint8Array(W * H);
    st = new Uint8Array(W * H);
    started = false; over = false; won = false;
    flags = 0; opened = 0; tSec = 0; face = 0;
    pressed = -1;
    stopTimer();
    for (var i = 0; i < W * H; i++) { cellEls[i].className = 'c cov'; cellEls[i].innerHTML = ''; }
    setFace(0);
    sync();
    fit();
  }

  // 首点安全区：落雷避开点击格及其八邻域
  function layMines(safe) {
    var ban = {};
    ban[safe] = 1;
    var ns = nbrs(safe);
    for (var k = 0; k < ns.length; k++) ban[ns[k]] = 1;
    var pool = [];
    for (var i = 0; i < W * H; i++) if (!ban[i]) pool.push(i);
    for (var j = pool.length - 1; j > 0; j--) {         // Fisher–Yates
      var r = (Math.random() * (j + 1)) | 0, t = pool[j]; pool[j] = pool[r]; pool[r] = t;
    }
    for (var m = 0; m < MINES; m++) grid[pool[m]] = MINE;
    for (var c = 0; c < W * H; c++) {
      if (grid[c] === MINE) continue;
      var n = 0, v = nbrs(c);
      for (var x = 0; x < v.length; x++) if (grid[v[x]] === MINE) n++;
      grid[c] = n;
    }
  }

  function paint(i) {
    var el = cellEls[i], g = grid[i], s = st[i];
    if (s === S_COV || s === S_FLAG || s === S_Q) {
      el.className = 'c cov' + (pressed === i ? ' dn' : '');
      el.innerHTML = (s === S_FLAG) ? SVG_FLAG : (s === S_Q ? SVG_Q : '');
    } else if (s === S_OPEN) {
      el.className = 'c opn';
      el.innerHTML = g ? '<span class="n' + g + '">' + g + '</span>' : '';
    } else if (s === S_WRONG) {
      el.className = 'c opn'; el.innerHTML = SVG_WRONG;
    } else {                                            // S_HIT
      el.className = 'c hit'; el.innerHTML = SVG_MINE;
    }
  }

  function paintAll() { for (var i = 0; i < W * H; i++) paint(i); }

  function setFace(k) { face = k; faceBtn.innerHTML = faceSVG(k); }

  function revealFrom(start) {
    if (st[start] === S_OPEN || st[start] === S_FLAG) return true;
    if (grid[start] === MINE) { st[start] = S_HIT; paint(start); return false; }
    var q = [start];
    while (q.length) {
      var i = q.pop();
      if (st[i] === S_OPEN || st[i] === S_FLAG) continue;
      st[i] = S_OPEN; opened++;
      if (grid[i] === 0) {
        var ns = nbrs(i);
        for (var k = 0; k < ns.length; k++) {
          var n = ns[k];
          if (st[n] === S_COV || st[n] === S_Q) q.push(n);
        }
      }
    }
    return true;
  }

  function chord(i) {
    if (st[i] === S_COV || st[i] === S_Q) return revealFrom(i);
    if (st[i] !== S_OPEN || grid[i] === 0 || grid[i] === MINE) return true;
    var ns = nbrs(i), f = 0, k;
    for (k = 0; k < ns.length; k++) if (st[ns[k]] === S_FLAG) f++;
    if (f !== grid[i]) return true;
    for (k = 0; k < ns.length; k++) {
      var n = ns[k];
      if (st[n] !== S_COV && st[n] !== S_Q) continue;
      if (!revealFrom(n)) return false;
    }
    return true;
  }

  function cycle(i) {
    // 只有「未翻开」的格子能循环；已翻开 / 已判定的不能
    if (over || st[i] === S_OPEN || st[i] === S_WRONG || st[i] === S_HIT) return;
    if (st[i] === S_COV) { st[i] = S_FLAG; flags++; SFX.flag(); }
    else if (st[i] === S_FLAG) { flags--; st[i] = markMode ? S_Q : S_COV; if (markMode) SFX.dig(); }
    else st[i] = S_COV;
    paint(i); sync();
  }

  function revealAll() {
    for (var i = 0; i < W * H; i++) {
      if (grid[i] === MINE) { st[i] = (st[i] === S_FLAG) ? S_WRONG : S_HIT; }
      else if (st[i] === S_FLAG) st[i] = S_WRONG;
    }
    paintAll();
  }

  function begin() {
    if (started) return;
    started = true;
    timer = setInterval(function () {
      if (tSec < 999) { tSec++; setDigits(digTime, fmtTime(tSec)); }
    }, 1000);
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function act(i, isChord) {
    if (over || i < 0) return;
    if (!started) { begin(); layMines(i); }

    if (isChord) {
      if (st[i] === S_OPEN) { if (!chord(i)) { lose(i); return; } }
      else { if (!revealFrom(i)) { lose(i); return; } }
    } else {
      if (st[i] === S_COV || st[i] === S_Q) { if (!revealFrom(i)) { lose(i); return; } }
    }
    paintAll(); sync();

    if (!over && opened === W * H - MINES) winGame();
  }

  function lose(hit) {
    over = true; won = false; stopTimer();
    SFX.boom();
    revealAll();
    setFace(2);
    status(hit !== undefined ? '踩到雷了 —— 按笑脸再来一局。' : '');
  }

  function winGame() {
    over = true; won = true; stopTimer();
    SFX.win();
    for (var i = 0; i < W * H; i++) if (grid[i] === MINE && st[i] !== S_FLAG) { st[i] = S_FLAG; flags++; }
    paintAll(); setFace(3); sync();
    var best = getBest(diff);
    var isRecord = tSec > 0 && (best === null || tSec < best);
    if (isRecord) setBest(diff, tSec);
    status(isRecord ? '新纪录！' + DIFFS[diff].name + ' ' + tSec + ' 秒。' : DIFFS[diff].name + ' 用时 ' + tSec + ' 秒。');
  }

  function sync() {
    setDigits(digMines, fmtMines(MINES - flags));
    setDigits(digTime, fmtTime(tSec));
    var best = getBest(diff);
    $('stInfo').textContent = DIFFS[diff].name + ' · ' + W + '×' + H + ' · ' + MINES + ' 雷';
    var hint;
    if (over) hint = won ? '全部标记完成。' : '游戏结束。';
    else if (over === false && !started) hint = '左键翻开 · 右键标旗 · 双击数字展开邻域';
    else hint = '双击数字可在旗数吻合时批量展开 · <b>游戏(G)</b> 菜单切换难度';
    $('stTip').innerHTML = hint;
    $('taskWin').querySelector('span').textContent = won ? '扫雷（胜）' : '扫雷';
  }
  function status(msg) { $('stTip').textContent = msg; }

  /* =========================================================
     6. 最佳时间
     ========================================================= */
  function getBest(d) { try { var v = localStorage.getItem(BEST_KEY + d); return v == null ? null : +v; } catch (e) { return null; } }
  function setBest(d, v) { try { localStorage.setItem(BEST_KEY + d, String(v)); } catch (e) {} }

  /* =========================================================
     7. 输入
     ========================================================= */
  var dragBtn = 0, downIdx = -1, lastTap = { i: -1, t: 0 }, lpTimer = null, lpFired = false;

  function idxFrom(e) {
    var el = e.target.closest ? e.target.closest('.c') : null;
    return el ? +el.dataset.i : -1;
  }
  // 指针被 board 捕获后，事件目标恒为 board，closest('.c') 拿不到格子。
  // 所以捕获态下改用命中测试反查。
  function idxAt(x, y) {
    var el = document.elementFromPoint(x, y);
    var c = el && el.closest ? el.closest('.c') : null;
    return c && board.contains(c) ? +c.dataset.i : -1;
  }

  board.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  board.addEventListener('pointerdown', function (e) {
    var i = idxFrom(e);
    if (i < 0) return;
    downIdx = i;
    try { board.setPointerCapture(e.pointerId); } catch (err) {}

    if (e.button === 2) { dragBtn = 2; cycle(i); e.preventDefault(); return; }
    if (e.button === 1) { dragBtn = 1; act(i, true); e.preventDefault(); return; }   // 中键＝和弦
    if (e.button !== 0) return;

    if (e.pointerType === 'touch') {
      lpFired = false;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(function () { lpFired = true; cycle(i); if (navigator.vibrate) navigator.vibrate(12); }, 420);
    }
    pressed = i; paint(i);
    dragBtn = 1;
    if (flagMode && e.pointerType === 'touch') cycle(i);
  });

  // 按住拖动：左键扫开经过的格子，右键连续标旗
  board.addEventListener('pointermove', function (e) {
    if (!dragBtn) return;
    var i = idxAt(e.clientX, e.clientY);
    if (i < 0 || i === downIdx) return;
    if (pressed >= 0) { pressed = -1; paint(pressed); }
    if (dragBtn === 2) { cycle(i); }
    else if (st[i] === S_COV) { act(i, false); }
    downIdx = i;
  });

  function endPointer(e) {
    clearTimeout(lpTimer);
    if (pressed >= 0) { pressed = -1; if (st) paintAll(); }
    var i = idxAt(e.clientX, e.clientY);
    var wasBtn = dragBtn;
    dragBtn = 0;
    if (wasBtn === 2) { downIdx = -1; return; }          // 右键落点已由 pointerdown 处理
    if (wasBtn !== 1 || lpFired || i < 0 || over) { downIdx = -1; return; }
    if (i !== downIdx) { downIdx = -1; return; }         // 拖动扫过的格子已经算过了
    downIdx = -1;

    var now = Date.now();
    var dbl = (i === lastTap.i && now - lastTap.t < 380);
    lastTap = { i: dbl ? -1 : i, t: now };
    act(i, dbl);
  }
  board.addEventListener('pointerup', endPointer);
  board.addEventListener('pointercancel', function () { clearTimeout(lpTimer); dragBtn = 0; downIdx = -1; pressed = -1; paintAll(); });

  // 键盘：方向键移动 + 空格翻开 + F 标旗
  var focusIdx = 0;
  board.addEventListener('keydown', function (e) {
    var x = focusIdx % W, y = (focusIdx / W) | 0, nx = x, ny = y;
    if (e.key === 'ArrowLeft') nx--; else if (e.key === 'ArrowRight') nx++;
    else if (e.key === 'ArrowUp') ny--; else if (e.key === 'ArrowDown') ny++;
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); act(focusIdx, true); return; }
    else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); cycle(focusIdx); return; }
    else return;
    e.preventDefault();
    nx = Math.max(0, Math.min(W - 1, nx)); ny = Math.max(0, Math.min(H - 1, ny));
    focusIdx = ny * W + nx;
  });

  faceBtn.addEventListener('click', function () { newGame(); faceBtn.blur(); });

  /* =========================================================
     8. 难度
     ========================================================= */
  function setDiff(d) {
    if (!DIFFS[d] || d === diff) { if (DIFFS[d]) newGame(); return; }
    diff = d;
    buildBoard();   // 换了尺寸就得重铺格子
    newGame();
  }

  /* =========================================================
     9. 菜单 / 对话框 / 窗口
     ========================================================= */
  var openMenuEl = null, openMenuKey = null;

  function closeMenus() {
    if (openMenuEl) openMenuEl.remove();
    openMenuEl = null; openMenuKey = null;
    document.body.classList.remove('menu-open');
    Array.prototype.forEach.call($('menubar').children, function (b) { b.classList.remove('open'); });
    $('startBtn').classList.remove('dn');
  }

  function buildMenu(host, items) {
    items.forEach(function (it) {
      if (it.sep) { var s = document.createElement('div'); s.className = 'msep'; host.appendChild(s); return; }
      var d = document.createElement('div');
      d.className = 'mi' + (it.dis ? ' dis' : '');
      d.innerHTML = '<span class="mk">' + (it.mark || '') + '</span>' +
                    (it.icon || '') +
                    '<span class="lab' + (it.bold ? '' : '') + '">' + it.label + '</span>' +
                    '<span class="acc">' + (it.acc || '') + '</span>';
      if (it.bold) d.querySelector('.lab').style.fontWeight = '700';
      d.addEventListener('click', function () {
        if (it.dis) return;
        closeMenus();
        it.run && it.run();
      });
      host.appendChild(d);
    });
  }

  function popup(items, x, y, key, btn) {
    closeMenus();
    var m = document.createElement('div');
    m.className = 'menu';
    buildMenu(m, items);
    document.body.appendChild(m);
    var w = m.offsetWidth, h = m.offsetHeight;
    if (x + w > innerWidth - 2) x = innerWidth - w - 2;
    if (y + h > innerHeight - 2) y = Math.max(2, y - h);
    m.style.left = x + 'px'; m.style.top = y + 'px';
    openMenuEl = m; openMenuKey = key;
    document.body.classList.add('menu-open');
    if (btn) btn.classList.add('open');
    return m;
  }

  function bestTable() {
    return '<table class="tbl">' + Object.keys(DIFFS).map(function (k) {
      var b = getBest(k);
      return '<tr><td class="k">' + DIFFS[k].name + '：</td><td>' + (b == null ? '999 秒' : b + ' 秒') + '</td></tr>';
    }).join('') + '</table>';
  }

  function bestText() {
    return Object.keys(DIFFS).map(function (k) {
      var b = getBest(k);
      return DIFFS[k].name + ' ' + (b == null ? '999' : b) + ' 秒';
    }).join('　');
  }

  function gameMenu() {
    return [
      { label: '开局(G)', acc: 'F2', run: function () { newGame(); } },
      { sep: 1 },
      { label: '初级(B)', mark: diff === 'beginner' ? '●' : '', run: function () { setDiff('beginner'); } },
      { label: '中级(I)', mark: diff === 'intermediate' ? '●' : '', run: function () { setDiff('intermediate'); } },
      { label: '高级(E)', mark: diff === 'expert' ? '●' : '', run: function () { setDiff('expert'); } },
      { sep: 1 },
      { label: '标记(?)', mark: markMode ? '√' : '', run: function () { markMode = !markMode; } },
      { sep: 1 },
      { label: '最佳时间(T)...', run: function () { dialog('最佳时间', bestTable()); } },
      { label: '音效(S)', mark: soundOn ? '√' : '', run: function () { toggleSound(); } },
      { sep: 1 },
      { label: '退出(X)', acc: 'Alt+F4', run: shutdown }
    ];
  }
  function helpMenu() {
    return [
      { label: '扫雷的操作方法(H)', acc: 'F1', run: function () { dialog('扫雷的操作方法',
        '<p><b>左键</b> 翻开格子。空白格会一直展开到有数字为止。</p>' +
        '<p><b>右键</b> 标旗 → 问号 → 取消。旗数要与数字吻合时，<b>双击</b> 该数字（或中键）可一次展开周围未标旗的格子。</p>' +
        '<p>第一下点击绝不会踩雷，并且会留出一片安全区。全部非雷格翻开即获胜。</p>' +
        '<p>键盘：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动，<kbd>空格</kbd> 翻开，<kbd>F</kbd> 标旗。</p>' +
        '<p>触屏：长按标旗，或用「标旗模式」按钮单击标旗。</p>'); } },
      { sep: 1 },
      { label: '最佳时间(T)', run: function () { dialog('最佳时间', bestTable()); } },
      { label: '关于扫雷(A)...', run: function () { dialog('关于扫雷',
        '<p><b>扫雷</b>　版本 1.0</p>' +
        '<p>单文件 H5 复刻，Windows 98 桌面风格。</p>' +
        '<p>三种难度：初级 9×9 / 10 雷，中级 16×16 / 40 雷，高级 30×16 / 99 雷。</p>' +
        '<p>最佳时间：' + bestText() + '</p>'); } }
    ];
  }

  $('menubar').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-menu]'); if (!b) return;
    if (openMenuKey === b.dataset.menu) { closeMenus(); return; }
    var r = b.getBoundingClientRect();
    popup(b.dataset.menu === 'game' ? gameMenu() : helpMenu(), r.left, r.bottom, b.dataset.menu, b);
  });
  $('menubar').addEventListener('pointerover', function (e) {
    var b = e.target.closest('button[data-menu]');
    if (b && openMenuEl && openMenuKey !== b.dataset.menu) {
      var r = b.getBoundingClientRect();
      popup(b.dataset.menu === 'game' ? gameMenu() : helpMenu(), r.left, r.bottom, b.dataset.menu, b);
    }
  });

  $('startBtn').addEventListener('click', function () {
    if (openMenuKey === 'start') { closeMenus(); return; }
    var r = $('startBtn').getBoundingClientRect();
    var m = document.createElement('div');
    m.className = 'startmenu';
    m.innerHTML = '<div class="spine"><b>Windows&nbsp;98</b></div><div class="items"></div>';
    var icon = '<svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" fill="#fff" stroke="#808080"/>' +
      '<path d="M6 9h8v3H6zM6 14h8v3H6zM6 19h8v3H6z" fill="#000080"/>' +
      '<path d="M17 9h9v3h-9zM17 14h9v3h-9zM17 19h6v3h-6z" fill="#808080"/></svg>';
    buildMenu(m.querySelector('.items'), [
      { label: '程序(P)', icon: icon, bold: 1, acc: '▸' },
      { label: '文档(D)', acc: '▸' },
      { label: '设置(S)', acc: '▸' },
      { label: '查找(C)', acc: '▸' },
      { label: '帮助(H)', run: function () { dialog('帮助', '<p>这是一个单文件扫雷。按 <b>游戏(G)</b> 切换难度，按 <b>F2</b> 开新局。</p>'); } },
      { label: '运行(R)...', acc: '▸' },
      { sep: 1 },
      { label: '关闭系统(U)...', bold: 1, run: shutdown }
    ]);
    document.body.appendChild(m);
    m.style.left = r.left + 'px';
    m.style.top = (r.top - m.offsetHeight - 2) + 'px';   // 留 2px，别让任务栏吃掉底边
    openMenuEl = m; openMenuKey = 'start';
    document.body.classList.add('menu-open');
    $('startBtn').classList.add('dn');
  });

  document.addEventListener('pointerdown', function (e) {
    if (!openMenuEl) return;
    if (openMenuEl.contains(e.target)) return;
    if (e.target.closest && e.target.closest('#menubar, #startBtn')) return;
    closeMenus();
  }, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && openMenuEl) { closeMenus(); return; }
    if (e.key === 'F2') { e.preventDefault(); newGame(); }
    if (e.key === 'F1') { e.preventDefault(); helpMenu()[0].run(); }
  });

  /* ---------- 对话框 ---------- */
  function dialog(title, bodyHtml) {
    closeMenus();
    var m = $('modal');
    m.innerHTML =
      '<div class="dlg"><div class="titlebar">' +
        '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#ffff00" stroke="#000" stroke-width="1.4"/>' +
        '<circle cx="6" cy="6.4" r="1.2" fill="#fff"/></svg>' +
        '<span class="t">' + title + '</span>' +
        '<span class="tbtns"><button class="tbtn close" data-close="1"><i></i><i></i></button></span>' +
      '</div><div class="body">' + bodyHtml + '</div>' +
      '<div class="foot"><button class="w98" data-close="1" style="min-width:64px">确定</button></div></div>';
    m.classList.add('on');
    var box = m.querySelector('.dlg');
    box.style.left = '50%';
    var close = function () { m.classList.remove('on'); m.innerHTML = ''; document.removeEventListener('keydown', onKey); };
    var onKey = function (e) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); close(); } };
    m.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', close); });
    m.addEventListener('pointerdown', function (e) { if (e.target === m) close(); });
    document.addEventListener('keydown', onKey);
    m.querySelector('[data-close].w98').focus();
  }

  /* ---------- 窗口控制 ---------- */
  function placeWindow() {
    fit();
    if (win.classList.contains('max')) return;
    var w = win.offsetWidth, h = win.offsetHeight;
    win.style.left = Math.max(2, Math.round((innerWidth - w) / 2)) + 'px';
    win.style.top = Math.max(2, Math.round((innerHeight - h) / 2.4)) + 'px';
  }
  win.addEventListener('click', function (e) {
    var b = e.target.closest('[data-win]'); if (!b) return;
    var a = b.dataset.win;
    if (a === 'min') { win.classList.add('min'); $('taskWin').classList.remove('act'); }
    else if (a === 'max') { win.classList.toggle('max'); if (!win.classList.contains('max')) placeWindow(); else fit(); }
    else shutdown();
  });
  $('taskWin').addEventListener('click', function () {
    win.classList.remove('min'); $('taskWin').classList.add('act'); placeWindow();
  });
  $('deskIcon').addEventListener('click', function () {
    win.classList.remove('min', 'max'); $('deskIcon').classList.add('sel'); placeWindow();
  });

  // 标题栏拖动
  var drag = null;
  $('titlebar').addEventListener('pointerdown', function (e) {
    if (e.target.closest('.tbtn') || win.classList.contains('max')) return;
    var r = win.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    $('titlebar').setPointerCapture(e.pointerId);
  });
  $('titlebar').addEventListener('pointermove', function (e) {
    if (!drag) return;
    var w = win.offsetWidth, h = win.offsetHeight;
    win.style.left = Math.max(-w + 60, Math.min(innerWidth - 60, e.clientX - drag.dx)) + 'px';
    win.style.top = Math.max(0, Math.min(innerHeight - 28, e.clientY - drag.dy)) + 'px';
  });
  $('titlebar').addEventListener('pointerup', function () { drag = null; });
  $('titlebar').addEventListener('pointercancel', function () { drag = null; });

  /* ---------- 关机 ---------- */
  function shutdown() {
    closeMenus();
    var off = $('off'), box = $('offBox'), btns = $('offBtns');
    function mk(label, fn) { var b = document.createElement('button'); b.className = 'w98'; b.textContent = label; b.addEventListener('click', fn); return b; }
    btns.innerHTML = '';
    btns.appendChild(mk('关闭计算机', function () {
      box.innerHTML = '<div>感谢您使用 Windows 98。</div><div>现在可以关闭电源了。</div>';
      btns.innerHTML = '';
      btns.appendChild(mk('重新启动', function () { location.reload(); }));
    }));
    btns.appendChild(mk('重新启动', function () { location.reload(); }));
    off.classList.add('on');
  }
  $('off').addEventListener('click', function (e) { if (e.target === $('off')) location.reload(); });

  /* ---------- 托盘 ---------- */
  var SOUND_ON = '<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#000"/><path d="M11 5.5a4 4 0 0 1 0 5M12.8 3.6a6.4 6.4 0 0 1 0 8.8" stroke="#000" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>';
  var SOUND_OFF = '<svg viewBox="0 0 16 16"><path d="M2 6h3l4-3v10l-4-3H2z" fill="#000"/><path d="M11 6l4 4M15 6l-4 4" stroke="#000" stroke-width="1.4" stroke-linecap="round"/></svg>';
  function toggleSound() {
    soundOn = !soundOn;
    $('traySound').innerHTML = soundOn ? SOUND_ON : SOUND_OFF;
    if (soundOn) { ac(); SFX.dig(); }
  }
  $('traySound').innerHTML = SOUND_ON;
  $('traySound').addEventListener('click', toggleSound);

  function tickClock() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('clock').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  /* ---------- 自适应格子 ---------- */
  function fit() {
    var maxW = Math.min(innerWidth - 40, 900);
    var maxH = innerHeight - (win.classList.contains('max') ? 70 : 210);
    var c = Math.floor(Math.min(maxW / W, maxH / H));
    c = Math.max(11, Math.min(20, c || 20));
    document.documentElement.style.setProperty('--cell', c + 'px');
  }

  var rz;
  function refit() { clearTimeout(rz); rz = setTimeout(placeWindow, 90); }
  addEventListener('resize', refit);
  addEventListener('orientationchange', refit);
  addEventListener('pageshow', refit);
  if (window.visualViewport) visualViewport.addEventListener('resize', refit);

  /* ---------- 旗标模式（触屏） ---------- */
  $('flagModeBtn').addEventListener('click', function () {
    flagMode = !flagMode;
    this.classList.toggle('on', flagMode);
  });

  /* =========================================================
     10. 启动
     ========================================================= */
  buildBoard();
  newGame();
  placeWindow();
  tickClock();
  setInterval(tickClock, 10000);

  /* =========================================================
     11. 测试钩子
     ========================================================= */
  window.__MS98 = {
    MINE: MINE,
    S_COV: S_COV, S_OPEN: S_OPEN, S_FLAG: S_FLAG, S_Q: S_Q, S_WRONG: S_WRONG,
    state: function () {
      return {
        diff: diff, W: W, H: H, MINES: MINES,
        grid: Array.prototype.slice.call(grid),
        st: Array.prototype.slice.call(st),
        flags: flags, opened: opened, started: started, over: over, won: won,
        tSec: tSec, face: face, markMode: markMode
      };
    },
    setDiff: setDiff, newGame: newGame,
    setMark: function (v) { markMode = !!v; },
    act: function (i, c) { act(i, !!c); },
    cycle: cycle,
    cellBox: function (i) {
      var r = cellEls[i].getBoundingClientRect();
      return { x: r.x + r.width / 2, y: r.y + r.height / 2, w: r.width };
    },
    lcd: function (which) {
      var digs = which === 'time' ? digTime : digMines;
      return digs.map(function (segs) {
        return segs.map(function (s) { return s.classList.contains('on') ? '1' : '0'; }).join('');
      }).join('|');
    },
    face: function () { return face; },
    setSeed: function (s) {
      var a = s >>> 0;
      Math.random = function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
  };
})();
</script>
</body>
</html>
