<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="墨鸢 · 水墨弹幕 —— 生宣长卷上的经典飞机大战。纸鸢、墨怪、朱砂弹幕，Web Audio 现场合成的宫商角徵羽。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23efe5d1'/><path d='M32 9 L32 41' stroke='%231a1814' stroke-width='4' stroke-linecap='round'/><path d='M32 21 L9 45 L32 39 Z' fill='%232a5670' fill-opacity='.72'/><path d='M32 21 L55 45 L32 39 Z' fill='%232a5670' fill-opacity='.52'/><path d='M32 41 L24 57 L32 52 L40 57 Z' fill='%231a1814' fill-opacity='.85'/><rect x='45' y='7' width='13' height='13' rx='2' fill='%23c8392c'/></svg>">
<title>墨鸢 · 水墨弹幕</title>
<style>
/* ============================================================
   墨鸢 · 水墨弹幕 — 单文件 H5
   ------------------------------------------------------------
   视觉论点：一幅正在被展开的手卷。
   战场不是「屏幕」，是一张生宣 —— 有纤维、有水痕、有颜料在
   边界处沉积的深色环（edge bloom）。所有精灵在载入时用同一
   套「湿画法」离线烘焙：笔触 + 抖动 + 边缘增稠 + 颗粒。
   玩家 = 写意纸鸢；敌人 = 纸鹤 / 墨蝶 / 石甲；boss = 饕餮面、墨龙。
   HUD 不是按钮条，是装裱绫边上的题跋：竖排、印章、器物。
   颜色纪律：两种墨（焦墨 / 花青）打天下，朱砂只给「危险」与「印」。
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}

:root{
  /* 纸 */
  --paper:#efe5d1; --paper-hi:#f9f4e9; --paper-lo:#e0d3ba;
  /* 两种墨 */
  --ink:#1a1814; --ink-2:#3a342a; --ink-3:#6b6252;
  --huaqing:#2a5670; --huaqing-l:#7aa2b2;
  /* 唯一的一支红：朱砂 */
  --zhusha:#c8392c; --zhusha-l:#e28a74;
  /* 装裱绫（深靛青） */
  --silk:#2b3841; --silk-hi:#374852; --silk-lo:#1f282f;
  --gold:rgba(198,168,116,.30);

  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --latin:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;

  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  --erode:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='e' x='0' y='0'><feTurbulence type='fractalNoise' baseFrequency='.42' numOctaves='5' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='2.6' intercept='-.72'/></feComponentTransfer></filter><rect width='140' height='140' filter='url(%23e)'/></svg>");

  --pw:480px; --ph:760px; --ml:60px; --mr:106px;
}

body{
  font-family:var(--serif);
  color:#8e9298;
  background:
    radial-gradient(130% 78% at 50% -6%, #1d262d 0%, rgba(29,38,45,0) 58%),
    radial-gradient(95% 62% at 50% 108%, #0b1013 0%, rgba(11,16,19,0) 72%),
    #090d10;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; overflow:hidden; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom) 8px;
  user-select:none; -webkit-user-select:none;
}
/* 桌面木纹 + 胶片颗粒 */
body::after{content:"";position:fixed;inset:0;background:var(--noise);opacity:.032;pointer-events:none;z-index:60}

/* ---------- 手卷 ---------- */
.frame{position:relative;display:flex;align-items:stretch;filter:drop-shadow(0 30px 60px rgba(0,0,0,.62))}
.mount{
  position:relative;display:flex;flex-direction:column;align-items:center;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.021) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 6px),
    linear-gradient(90deg,var(--silk-lo),var(--silk-hi) 42%,var(--silk-lo));
  box-shadow:inset 0 0 0 1px var(--gold);
}
.mount-l{width:var(--ml);border-right:1px solid var(--gold)}
.mount-r{width:var(--mr);border-left:1px solid var(--gold)}
.sig{
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:11px;letter-spacing:.52em;color:rgba(222,206,170,.26);
  margin:auto 0 16px;padding-top:18px;
}

.stage{
  position:relative;width:var(--pw);height:var(--ph);
  background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(122,100,66,.26), inset 0 0 60px rgba(126,98,60,.13);
}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
/* 纸的自身投影：让画面沉进纸里 */
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 96% at 50% 44%, rgba(0,0,0,0) 58%, rgba(88,66,38,.16) 100%)}

/* ---------- 题跋（竖排） ---------- */
.insc{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 0 0;width:100%}
.row{writing-mode:vertical-rl;text-orientation:upright;display:flex;flex-direction:column;align-items:center}
.row i{font-style:normal;font-size:10px;letter-spacing:.3em;color:rgba(214,198,162,.40);margin-bottom:5px}
.row b{font-weight:400;font-size:16px;letter-spacing:.14em;color:rgba(236,226,204,.92);font-family:var(--latin)}
.row b.cn{font-family:var(--serif);font-size:15px;color:rgba(236,226,204,.80)}
.lives{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:2px}
.life{width:8px;height:8px;background:rgba(232,222,200,.82);border-radius:60% 60% 60% 0;transform:rotate(-45deg)}
.life.off{background:rgba(232,222,200,.13)}
.pips{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:3px}
.pip{width:4px;height:13px;background:rgba(232,222,200,.13)}
.pip.on{background:rgba(236,226,204,.86)}
.combo{
  writing-mode:vertical-rl;text-orientation:upright;font-size:12px;letter-spacing:.24em;
  color:rgba(200,57,44,.9);height:0;opacity:0;overflow:hidden;transition:opacity .2s;
}
.combo.on{height:auto;opacity:1}
.combo b{font-family:var(--latin);font-weight:400}

/* 朱砂印 = 炸弹数 */
.seal{
  position:relative;width:54px;height:54px;margin-top:2px;border-radius:3px;
  background:linear-gradient(155deg,var(--zhusha),#a82c22);
  box-shadow:inset 0 0 0 1px rgba(255,240,232,.30), 0 2px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  transform:rotate(-2.2deg);
  -webkit-mask-image:var(--erode);mask-image:var(--erode);
  -webkit-mask-size:140px 140px;mask-size:140px 140px;
  transition:filter .3s,transform .3s;
}
.seal span{position:absolute;font-size:11px;letter-spacing:.1em;color:#fdf3ec;opacity:.9;top:6px}
.seal b{font-family:var(--latin);font-weight:400;font-size:22px;color:#fdf3ec;margin-top:8px}
.seal.empty{filter:grayscale(.85) brightness(.62)}
.seal.ready{animation:sealBreathe 2.6s ease-in-out infinite}
@keyframes sealBreathe{0%,100%{transform:rotate(-2.2deg) scale(1)}50%{transform:rotate(-2.2deg) scale(1.045)}}

.tools{margin-top:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:9px}
.btn{
  font-family:var(--serif);color:rgba(232,222,200,.82);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(0,0,0,.16));
  border:1px solid rgba(198,168,116,.26);border-radius:2px;cursor:pointer;
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:14px;letter-spacing:.22em;padding:11px 5px;min-width:32px;min-height:32px;
  transition:color .18s,border-color .18s,background .18s;
}
.btn:hover{color:#f4ecd8;border-color:rgba(198,168,116,.5)}
.btn:active{background:rgba(0,0,0,.3)}
.btn.off{color:rgba(232,222,200,.32);text-decoration:line-through}

/* ---------- 提示行 ---------- */
.hint{font-size:11px;letter-spacing:.14em;color:rgba(150,156,162,.42);text-align:center;line-height:1.7;max-width:90vw}
.hint kbd{font-family:var(--latin);font-size:11px;letter-spacing:0;color:rgba(200,206,212,.7)}

/* ---------- 卷题 ---------- */
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.card span{
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:36px;letter-spacing:.34em;color:var(--ink);opacity:0;
  padding:22px 14px;background:rgba(247,241,229,.5);
  box-shadow:inset 0 0 0 1px rgba(40,34,24,.16);
}
.card.run span{animation:cardIn 2.4s cubic-bezier(.22,.68,.32,1) forwards}
.card.run.zhu span{color:var(--zhusha);font-size:44px}
@keyframes cardIn{
  0%{opacity:0;filter:blur(9px);transform:translateY(-14px) scale(.96)}
  16%{opacity:1;filter:blur(0);transform:none}
  70%{opacity:1;filter:blur(0)}
  100%{opacity:0;filter:blur(5px)}
}

/* ---------- 帖（面板） ---------- */
.panel{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(238,229,213,.90);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .45s ease;
}
.panel.on{opacity:1;pointer-events:auto}
.slip{
  position:relative;transform:rotate(-.5deg);
  background:var(--paper-hi);padding:30px 30px 26px;
  box-shadow:inset 0 0 0 1px rgba(40,34,24,.34), inset 0 0 0 5px var(--paper-hi), inset 0 0 0 6px rgba(40,34,24,.13), 0 12px 34px rgba(40,30,16,.28);
  max-width:82%;text-align:center;color:var(--ink);
}
.slip::after{content:"";position:absolute;inset:0;background:var(--noise);opacity:.055;pointer-events:none}
.logo{margin:2px 0 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.logo span{font-size:46px;line-height:1.04;color:var(--ink);text-shadow:0 0 14px rgba(26,24,20,.28)}
.slip .sub{font-size:11px;letter-spacing:.4em;color:var(--ink-3);margin:10px 0 0}
.slip .rules{font-size:12px;line-height:2.1;color:var(--ink-2);letter-spacing:.06em;margin:16px 0 4px}
.slip .rules em{font-style:normal;color:var(--zhusha)}
.acts{display:flex;gap:14px;justify-content:center;margin-top:20px}
.btn2{
  font-family:var(--serif);font-size:17px;letter-spacing:.26em;color:var(--ink);
  writing-mode:vertical-rl;text-orientation:upright;
  background:linear-gradient(180deg,#fdf8ee,#efe5d1);
  border:1px solid rgba(40,34,24,.62);border-radius:2px;cursor:pointer;
  padding:15px 7px;min-width:46px;
  box-shadow:2px 3px 0 rgba(40,34,24,.16);
  transition:transform .12s,box-shadow .12s,background .18s;
}
.btn2:hover{background:linear-gradient(180deg,#fffaf2,#f4ebd9)}
.btn2:active{transform:translate(2px,3px);box-shadow:0 0 0 rgba(40,34,24,.16)}
.btn2:disabled{opacity:.34;cursor:default;box-shadow:2px 3px 0 rgba(40,34,24,.08)}
.btn2:disabled:active{transform:none;box-shadow:2px 3px 0 rgba(40,34,24,.08)}
.stage.booting::before{
  content:"研 墨";position:absolute;left:0;right:0;top:46%;text-align:center;z-index:8;
  font-size:15px;letter-spacing:.7em;text-indent:.7em;color:rgba(62,50,34,.30);
  animation:bootPulse 1.15s ease-in-out infinite;pointer-events:none;
}
@keyframes bootPulse{0%,100%{opacity:.2}50%{opacity:.75}}
.btn2.ghost{border-color:rgba(40,34,24,.32);box-shadow:none;color:var(--ink-2)}
.mini{position:absolute;right:11px;bottom:9px;width:26px;height:26px;border-radius:2px;
  background:var(--zhusha);color:#fdf3ec;font-size:12px;display:flex;align-items:center;justify-content:center;
  transform:rotate(3deg);letter-spacing:0;opacity:.92}
.tbl{font-size:13px;line-height:2;color:var(--ink-2);letter-spacing:.1em;margin-top:6px}
.tbl b{font-family:var(--latin);font-weight:400;font-size:20px;color:var(--ink);letter-spacing:0}
.tbl .big{font-size:34px}
.ttl{font-size:30px;letter-spacing:.3em;margin:0}

.hidden{display:none !important}
#fatal{position:absolute;inset:0;z-index:30;background:#1a1814;color:#efe5d1;font-size:12px;padding:20px;display:none;overflow:auto;white-space:pre-wrap;pointer-events:none}

@media (max-width:640px){
  :root{--ml:24px;--mr:74px}
  .logo span{font-size:38px}
  .hint{font-size:10px;letter-spacing:.08em}
}
@media (prefers-reduced-motion:reduce){
  .card.run span{animation-duration:1.6s}
  .seal.ready{animation:none}
}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="mount mount-l">
    <div class="sig">墨 鸢 · 水 墨 弹 幕</div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="card" id="card"><span id="cardTx">第 一 卷</span></div>
    <div id="fatal"></div>

    <div class="panel on" id="pStart">
      <div class="slip">
        <div class="logo"><span>墨</span><span>鸢</span></div>
        <p class="sub">水 墨 弹 幕</p>
        <div class="rules">
          拖动纸面 或 <em>WASD</em> 走位 · 自动开火<br>
          <em>空格</em> 掷符（清弹） · <em>Shift</em> 定身看清判定点<br>
          <em>P</em> 驻笔 · <em>M</em> 静音
        </div>
        <div class="acts"><button class="btn2" id="btnStart" disabled>启笔</button></div>
        <div class="mini">鸢</div>
      </div>
    </div>

    <div class="panel" id="pOver">
      <div class="slip">
        <h2 class="ttl">墨 尽</h2>
        <div class="tbl">
          积 <b class="big" id="oScore">0</b><br>
          最 <b id="oBest">0</b> · 连 <b id="oCombo">0</b> · 卷 <b id="oWave">一</b>
        </div>
        <div class="acts">
          <button class="btn2" id="btnRetry">重研</button>
          <button class="btn2 ghost" id="btnMenu">卷首</button>
        </div>
        <div class="mini">尽</div>
      </div>
    </div>

    <div class="panel" id="pPause">
      <div class="slip">
        <h2 class="ttl">驻 笔</h2>
        <div class="acts">
          <button class="btn2" id="btnResume">续墨</button>
          <button class="btn2 ghost" id="btnQuit">弃卷</button>
        </div>
        <div class="mini">驻</div>
      </div>
    </div>
  </div>

  <div class="mount mount-r">
    <div class="insc">
      <div class="row"><i>积</i><b id="uiScore">0</b></div>
      <div class="row"><i>卷</i><b class="cn" id="uiWave">一·一</b></div>
      <div class="row"><i>命</i><div class="lives" id="uiLives"></div></div>
      <div class="row"><i>器</i><div class="pips" id="uiWeap"></div></div>
      <div class="combo" id="uiCombo">连<b>0</b></div>
    </div>
    <div class="seal empty" id="uiSeal"><span>符</span><b>0</b></div>
    <div class="tools">
      <button class="btn" id="btnPause" title="暂停 (P)">驻</button>
      <button class="btn" id="btnMute" title="静音 (M)">音</button>
    </div>
  </div>
</div>

<p class="hint">
  <kbd>拖动 / WASD</kbd> 走位 · 自动开火 · <kbd>空格</kbd> 掷符 · <kbd>Shift</kbd> 定身 · <kbd>P</kbd> 驻笔 · <kbd>M</kbd> 静音
</p>

<script>
/* ==================================================================
   墨鸢 · 水墨弹幕
   ================================================================== */
'use strict';
(function(){
'use strict';

var ERRORS=[];
window.addEventListener('error',function(e){ ERRORS.push(String(e.message)+' @'+(e.lineno||0)); });
window.addEventListener('unhandledrejection',function(e){ ERRORS.push('promise:'+e.reason); });

/* ============================ 一 · 基元 ============================ */
var TAU=Math.PI*2, PI=Math.PI;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(e0,e1,x){ var t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
var RND=mulberry32(1);
function R(){ return RND(); }
function RR(a,b){ return a+RND()*(b-a); }
function RI(a,b){ return Math.floor(a+RND()*(b-a+1)); }
var CN='零一二三四五六七八九';
function cn(n){ if(n<10) return CN[n]; if(n===10) return '十'; if(n<20) return '十'+CN[n-10]; return CN[Math.floor(n/10)]+'十'+(n%10?CN[n%10]:''); }

/* 值噪声：宣纸的纤维、水痕、颜料颗粒全靠它 */
var NP=new Uint8Array(512);
(function(){ var p=new Uint8Array(256); for(var i=0;i<256;i++)p[i]=i; var r=mulberry32(1337);
  for(var i=255;i>0;i--){ var j=(r()*(i+1))|0, t=p[i]; p[i]=p[j]; p[j]=t; }
  for(var i=0;i<512;i++)NP[i]=p[i]; })();
function hsh(x,y){ return NP[(NP[x&255]+y)&255]*0.00392156862745098; }
function vnoise(x,y){
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  var u=xf*xf*xf*(xf*(xf*6-15)+10), v=yf*yf*yf*(yf*(yf*6-15)+10);
  var a=hsh(xi,yi), b=hsh(xi+1,yi), c=hsh(xi,yi+1), d=hsh(xi+1,yi+1);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,y,o){ o=o||3; var s=0,a=.5,f=1,n=0; for(var i=0;i<o;i++){ s+=a*vnoise(x*f,y*f); n+=a; a*=.5; f*=2; } return s/n; }

/* 中国传统颜料 */
var C={
  ink:[24,22,18], ink2:[54,49,40], ink3:[124,116,98],
  hq:[42,86,112], hql:[132,170,186],
  zs:[200,58,44], zsl:[228,142,120],
  th:[204,150,56],
  paper:[239,229,213], paperHi:[250,245,234]
};
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function shadec(c,t){ if(t<=1) return [c[0]*t+9*(1-t), c[1]*t+8*(1-t), c[2]*t+6*(1-t)]; var k=t-1; return [c[0]+(255-c[0])*k, c[1]+(255-c[1])*k, c[2]+(255-c[2])*k]; }

function mkc(w,h){ var c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h)); return c; }

/* ============================ 二 · 湿画法 ============================
   一片水彩不是「模糊的圆」，而是：
     1) 不规则的边界（笔触宽度沿路径抖动 + 手绘偏移）
     2) 边缘增稠（颜料在干燥时被推到边界 → 深色环）
     3) 内部不匀（湿画法水痕 + 纸纹颗粒）
   下面把「密度场 → 上色」做成通用管线，背景山峦也走同一条。
   ================================================================ */

/* 笔触距离场 */
var _pd=0,_pt=0;
function polyDist(px,py,pts){
  var best=1e9, bt=0;
  for(var i=0;i<pts.length-1;i++){
    var ax=pts[i][0], ay=pts[i][1], bx=pts[i+1][0], by=pts[i+1][1];
    var dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy||1e-6;
    var t=((px-ax)*dx+(py-ay)*dy)/l2; t=t<0?0:(t>1?1:t);
    var cx=ax+dx*t, cy=ay+dy*t;
    var ddx=px-cx, ddy=py-cy, d=ddx*ddx+ddy*ddy;
    if(d<best){ best=d; bt=(i+t)/(pts.length-1); }
  }
  _pd=Math.sqrt(best); _pt=bt; return _pd;
}

function fieldBlur(f,w,h){
  var o=new Float32Array(f.length);
  for(var y=0;y<h;y++){
    var ym=(y>0?y-1:0)*w, yp=(y<h-1?y+1:0)*w, y0=y*w;
    for(var x=0;x<w;x++){
      var xm=x>0?x-1:0, xp=x<w-1?x+1:0;
      o[y0+x]=(f[ym+xm]*1+f[ym+x]*2+f[ym+xp]*1+f[y0+xm]*2+f[y0+x]*4+f[y0+xp]*2+f[yp+xm]*1+f[yp+x]*2+f[yp+xp]*1)/16;
    }
  }
  return o;
}

function fieldStrokes(w,h,strokes,res){
  var fw=Math.max(2,Math.ceil(w/res)), fh=Math.max(2,Math.ceil(h/res));
  var f=new Float32Array(fw*fh), sx=w/fw, sy=h/fh, k, st, y, x, i, s, ww, d, q, pt;
  for(k=0;k<strokes.length;k++){
    st=strokes[k];
    var wdt=st.w, prof=st.prof==null?0.35:st.prof, wob=st.wob==null?0.10:st.wob,
        dry=st.dry||0, al=st.a==null?1:st.a, ph=st.ph==null?R()*TAU:st.ph, pts=st.p;
    /* 包围盒剔除：一笔只扫它自己那一小块，别让每个像素去测所有笔触 */
    var mx=wdt*(1+wob*1.2)*1.4, bx0=1e9, bx1=-1e9, by0=1e9, by1=-1e9;
    for(q=0;q<pts.length;q++){ pt=pts[q];
      if(pt[0]<bx0)bx0=pt[0]; if(pt[0]>bx1)bx1=pt[0];
      if(pt[1]<by0)by0=pt[1]; if(pt[1]>by1)by1=pt[1]; }
    var x0=Math.max(0,Math.floor((bx0-mx)/sx)), x1=Math.min(fw-1,Math.ceil((bx1+mx)/sx));
    var y0=Math.max(0,Math.floor((by0-mx)/sy)), y1=Math.min(fh-1,Math.ceil((by1+mx)/sy));
    if(x1<x0||y1<y0) continue;
    for(y=y0;y<=y1;y++){
      var py=(y+0.5)*sy;
      for(x=x0;x<=x1;x++){
        var px=(x+0.5)*sx;
        polyDist(px,py,pts);
        s=Math.sqrt(Math.sin(PI*_pt)); if(s<0)s=0;
        ww=wdt*(prof+(1-prof)*s)*(1+wob*(Math.sin(_pt*8.3+ph)*0.72+Math.sin(_pt*21.7+ph*1.7)*0.28));
        if(ww<0.3) continue;
        d=1-_pd/ww; if(d<=0) continue;
        d=smoothstep(0,1,d); d=d*d*(3-2*d);
        if(dry>0) d*=1-dry*0.62*smoothstep(0.42,1,fbm(px*1.15+ph*31,py*0.3+ph*17,2));
        d*=al; i=y*fw+x; if(d>f[i]) f[i]=d;
      }
    }
  }
  return {f:fieldBlur(f,fw,fh), fw:fw, fh:fh};
}

function fieldFn(w,h,res,fn){
  var fw=Math.max(2,Math.ceil(w/res)), fh=Math.max(2,Math.ceil(h/res));
  var f=new Float32Array(fw*fh), sx=w/fw, sy=h/fh;
  for(var y=0;y<fh;y++)for(var x=0;x<fw;x++) f[y*fw+x]=clamp(fn((x+0.5)*sx,(y+0.5)*sy,x/fw,y/fh),0,1);
  return {f:f, fw:fw, fh:fh};
}

/* 颗粒查找表：一次算好 256×256 的无缝水痕，上色循环里改成一次数组取值
   （频率取 20/256 与 40/256 个晶格，保证平铺无缝） */
var MOTT=null;
function buildMott(){
  if(MOTT) return;
  MOTT=new Float32Array(65536);
  for(var y=0;y<256;y++)for(var x=0;x<256;x++){
    MOTT[y*256+x]=vnoise(x*0.078125,y*0.078125)*0.66+vnoise(x*0.15625+11.3,y*0.15625+7.7)*0.34;
  }
}

/* 密度场 → 上色（标量运算，避免每像素建数组） */
function washPaint(cv,fld,opt){
  var w=cv.width, h=cv.height, g=cv.getContext('2d');
  var img=g.createImageData(w,h), d=img.data;
  var core=opt.core||C.ink, light=opt.light||mixc(C.paperHi,core,0.24), rim=opt.rim||shadec(core,0.5);
  var maxA=opt.maxA==null?0.94:opt.maxA, mAmt=opt.mott==null?0.34:opt.mott, eAmt=opt.edge==null?0.45:opt.edge;
  var lr=light[0],lg=light[1],lb=light[2], cr=core[0],cg=core[1],cb=core[2], rr=rim[0],rg=rim[1],rb=rim[2];
  var f=fld.f, fw=fld.fw, fh=fld.fh, gx=fw/w, gy=fh/h, x, y, i, fx, fy, x0, y0, tx, ty, a0,a1,b0,b1, v, e, p, al, m, r, gg2, b2, e2;
  if(!MOTT) buildMott();
  for(y=0;y<h;y++){
    fy=(y+0.5)*gy-0.5; fy=clamp(fy,0,fh-1.001); y0=fy|0; ty=fy-y0;
    for(x=0;x<w;x++){
      i=(y*w+x)*4;
      fx=(x+0.5)*gx-0.5; fx=clamp(fx,0,fw-1.001); x0=fx|0; tx=fx-x0;
      a0=f[y0*fw+x0]; a1=f[y0*fw+x0+1]; b0=f[(y0+1)*fw+x0]; b1=f[(y0+1)*fw+x0+1];
      v=lerp(lerp(a0,a1,tx),lerp(b0,b1,tx),ty);
      if(v<=0.004){ d[i+3]=0; continue; }
      e=smoothstep(0.20,0.55,v)*(1-smoothstep(0.60,1.0,v));
      m=1-mAmt*0.5+mAmt*MOTT[((y&255)<<8)+(x&255)];
      p=(v*1.05+e*eAmt)*m;
      al=smoothstep(0,0.60,p)*maxA;
      if(al<=0.005){ d[i+3]=0; continue; }
      var t=clamp(p*1.3,0,1);
      r=lr+(cr-lr)*t; gg2=lg+(cg-lg)*t; b2=lb+(cb-lb)*t;
      e2=e*0.62; r+=(rr-r)*e2; gg2+=(rg-gg2)*e2; b2+=(rb-b2)*e2;
      d[i]=r; d[i+1]=gg2; d[i+2]=b2; d[i+3]=al*255;
    }
  }
  g.putImageData(img,0,0);
  return cv;
}

/* 单层精灵 */
function spr(w,h,strokes,opt){
  opt=opt||{};
  return washPaint(mkc(w,h), fieldStrokes(w,h,strokes,opt.res||2), opt);
}
/* 多层精灵（先花青淡彩，再焦墨笔触 —— 淡彩一定在底） */
function sprL(w,h,layers){
  var cv=mkc(w,h), g=cv.getContext('2d');
  for(var i=0;i<layers.length;i++){
    var L=layers[i], f=fieldStrokes(w,h,L.s,L.o&&L.o.res||2), t=washPaint(mkc(w,h),f,L.o||{});
    g.drawImage(t,0,0);
  }
  return cv;
}
function mir(pts,cx){ var o=[]; for(var i=0;i<pts.length;i++) o.push([2*cx-pts[i][0],pts[i][1]]); return o; }
function mirS(list,cx){ var o=list.slice(); for(var i=0;i<list.length;i++){ var s={},k; for(k in list[i]) s[k]=list[i][k]; s.p=mir(list[i].p,cx); o.push(s); } return o; }
function PT(){ var a=[]; for(var i=0;i<arguments.length;i+=2) a.push([arguments[i],arguments[i+1]]); return a; }

/* 宣纸 */
var paperCv=null, paperPat=null;
function buildPaper(){
  var S=420, cv=mkc(S,S), g=cv.getContext('2d');
  var img=g.createImageData(S,S), d=img.data, PR=C.paper, x, y, i, v;
  for(y=0;y<S;y++)for(x=0;x<S;x++){
    i=(y*S+x)*4;
    v=1+(hsh(x*3,y*3)-0.5)*0.05+(fbm(x*0.03,y*0.11,2)-0.5)*0.055+(fbm(x*0.9,y*0.9,2)-0.5)*0.032+(R()-0.5)*0.02;
    d[i]=clamp(PR[0]*v,0,255); d[i+1]=clamp(PR[1]*v,0,255); d[i+2]=clamp(PR[2]*v*0.994,0,255); d[i+3]=255;
  }
  g.putImageData(img,0,0);
  g.lineCap='round';
  for(i=0;i<1200;i++){
    x=R()*S; y=R()*S;
    var len=4+R()*26, ang=(R()-0.5)*0.5+(R()<0.25?PI/2:0);
    g.strokeStyle=R()<0.5?'rgba(118,102,76,.030)':'rgba(255,252,244,.048)';
    g.lineWidth=R()*1.1+0.35;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len); g.stroke();
  }
  for(i=0;i<54;i++){
    g.fillStyle='rgba(92,76,52,'+(0.05+R()*0.10)+')';
    g.beginPath(); g.arc(R()*S,R()*S,R()*1.1+0.25,0,TAU); g.fill();
  }
  return cv;
}

  }
  over(far, tileStrokes(tw,th,farSt,{core:mixc(C.ink,C.paperHi,0.42), rim:mixc(C.hq,C.paperHi,0.4), light:C.paperHi, maxA:0.5, edge:0.4, mott:0.4}));

  /* ---- 中景：山脊 + 松 + 水纹 ---- */
  var mid=tileField(tw,th,3.6,function(px,py){
    var wx=px*S, wy=py*S, d=0, m, ry, band;
    for(k=0;k<2;k++){
      ry=k===0? ridge(wx,0.545*H,36,0.0068,17.7) : ridge(wx,0.695*H,24,0.0129,23.3);
      band=k===0?0.25*H:0.17*H;
      m=smoothstep(ry-5,ry+5,wy)*(1-smoothstep(ry+2,ry+band,wy));
      d=Math.max(d,m*(k===0?0.80:0.58));
    }
    return d;
  },{core:mixc(C.hq,C.paperHi,0.46), rim:mixc(C.hq,C.paperHi,0.56), light:mixc(C.paperHi,C.hq,0.10), maxA:0.50, edge:0.55, mott:0.5}, 0.8);
  var midSt=[];
  for(i=0;i<5;i++){
    var px1=tw*(0.06+i*0.21+r()*0.06), py1=ridge(px1*S,0.545*H,36,0.0068,17.7)*T+4;
    midSt=midSt.concat(pineStrokes(px1,py1,T*(1.45+r()*0.6),r()*10));
  }
  for(i=0;i<16;i++){ /* 水纹 */
    var wx2=tw*r(), wy2=th*(0.60+r()*0.07);
    midSt.push({p:[[wx2,wy2],[wx2+10+r()*34,wy2]], w:1.3, prof:0.2, dry:0.4, wob:0.15, a:0.75});
  }
  over(mid, tileStrokes(tw,th,midSt,{core:mixc(C.ink,C.paperHi,0.12), rim:C.ink2, light:C.ink3, maxA:0.78, edge:0.45, mott:0.4}));

  /* ---- 近景：浓墨坡岸 + 苔点 ---- */
  var near=tileField(tw,th,3.2,function(px,py){
    var wx=px*S, wy=py*S;
    var ry=ridge(wx,0.885*H,24,0.0092,41.5);
    var m=smoothstep(ry-6,ry+6,wy)*(1-smoothstep(ry+3,0.97*H,wy));
    return m*0.95;
  },{core:mixc(C.ink,C.paperHi,0.34), rim:mixc(C.ink,C.paperHi,0.20), light:mixc(C.paperHi,C.ink,0.14), maxA:0.58, edge:0.5, mott:0.45});
  var nearSt=[];
  for(i=0;i<2;i++){
    var px2=tw*(0.18+i*0.46+r()*0.08), py2=ridge(px2*S,0.885*H,24,0.0092,41.5)*T+5;
    nearSt=nearSt.concat(pineStrokes(px2,py2,T*(1.1+r()*0.4),r()*10));
  }
  for(i=0;i<44;i++){ /* 苔点 */
    var ax=tw*r(), ay=ridge(ax*S,0.885*H,24,0.0092,41.5)*T + r()*22;
    nearSt.push({p:[[ax,ay]], w:1.4+r()*3, prof:0.85, wob:0.2, a:0.8});
  }
  over(near, tileStrokes(tw,th,nearSt,{core:C.ink, rim:shadec(C.ink,0.5), light:C.ink3, maxA:0.6, edge:0.45, mott:0.4}));

  LS=[{cv:far,sp:9,tint:null},{cv:mid,sp:20,tint:null},{cv:near,sp:38,tint:null}];
  LOFF=[0,0,0];

  MOTES=[];
  for(i=0;i<26;i++) MOTES.push({x:R()*W, y:R()*H, r:0.6+r()*2.1, a:0.05+r()*0.10, vy:-(6+r()*16), ph:r()*TAU});
  if(!SP.wetDot) SP.wetDot=dotSprite(46,C.ink,shadec(C.ink,0.55),0.4);
  if(!paperPat){ paperCv=buildPaper(); paperPat=cv.getContext('2d').createPattern(paperCv,'repeat'); }
  wet=mkc(P.w,P.h); wg=wet.getContext('2d');
}

/* ---------- 敌 ---------- */
function spawn(type,x,y,o){
  var T=ET[type], e={type:type,x:x,y:y,bx:x,t:0,ph:R()*TAU,r:T.r,side:1,dir:1,flash:0,dead:0,hold:0,curve:0,y0:y,fire:0};
  e.hp=Math.round(T.hp*(1+G.stage*0.34+G.wave*0.11));
  e.maxhp=e.hp;
  e.spd=T.spd*(1+G.stage*0.06+G.wave*0.018);
  if(o) for(var k in o) e[k]=o[k];
  G.enemies.push(e); return e;
}
function aimedShot(x,y,sp,r,c){
  var a=Math.atan2(P1.y-y,P1.x-x);
  eb(x,y,Math.cos(a)*sp,Math.sin(a)*sp,r,c,0);
  A.play('eshot');
}
function updEnemy(e,dt){
  e.t+=dt; if(e.flash>0) e.flash-=dt;
  if(e.curve){ e.bx+=e.dir*e.curve*dt; if(e.bx<66||e.bx>P.w-66){ e.curve=0; e.bx=clamp(e.bx,66,P.w-66); } }
  var T=ET[e.type], i, d0, sp;
  switch(e.type){
    case 'crane': e.y+=e.spd*dt; e.x=e.bx+Math.sin(e.t*1.9+e.ph)*24; break;
    case 'moth':  e.y+=e.spd*dt; e.x=e.bx+Math.sin(e.t*5.2+e.ph)*54; break;
    case 'armor': e.y+=e.spd*dt; e.x=e.bx+Math.sin(e.t*1.1+e.ph)*15;
      e.fire-=dt;
      if(e.fire<=0){ e.fire=T.fire*Math.max(0.6,1-G.stage*0.07); aimedShot(e.x,e.y+18,200+G.stage*9,7,C.zs); }
      break;
    case 'flag':
      if(!e.hold){ e.y+=e.spd*dt; if(e.y>=e.y0){ e.hold=1; e.y=e.y0; } }
      else { e.x+=e.dir*e.spd*0.82*dt; if(e.x<72||e.x>P.w-72) e.dir*=-1; }
      e.fire-=dt;
      if(e.fire<=0){ e.fire=T.fire*Math.max(0.6,1-G.stage*0.07);
        d0=Math.atan2(P1.y-(e.y+32),P1.x-e.x); sp=192+G.stage*9;
        for(i=-1;i<=1;i++) eb(e.x,e.y+32,Math.cos(d0+i*0.24)*sp,Math.sin(d0+i*0.24)*sp,6,C.zs,0);
        A.play('eshot');
      }
      break;
  }
  if(e.y>P.h+80||e.x<-90||e.x>P.w+90) e.dead=1;
}
function hurtEnemy(e,dmg,fx0,fy0){
  e.hp-=dmg; e.flash=0.1;
  if(e.hp>0){ if(dmg<8) A.play('hit'); addDot2(fx0,fy0); return; }
  e.dead=1; G.kills++;
  A.play('boom');
  var sc=e.r/16;
  addSplat(e.x,e.y,sc*1.05,C.ink);
  if(e.type==='flag') addSplatHq(e.x,e.y,1.1);
  G.combo++; G.comboT=2.6; if(G.combo>G.maxCombo) G.maxCombo=G.combo;
  var mult=1+Math.min(G.combo,24)*0.06;
  G.score+=Math.round(ET[e.type].sc*mult);
  if(R()<ET[e.type].drop*(1+G.stage*0.06)) dropItem(e.x,e.y);
  var i, n=1+(e.r>18?2:0);
  for(i=0;i<n;i++) fx({t:'dot',x:e.x,y:e.y,vx:RR(-190,190),vy:RR(-190,190),r:RR(2,6),life:RR(0.3,0.8),max:0.8,img:SP.dotInk});
  G.shake=Math.max(G.shake,3.2);
}

/* ---------- boss ---------- */
function makeBoss(stage){
  var even=stage%2===0;
  var b={x:P.w/2,y:-170,t:0,intro:2.1,ph:0,pat:PHASE[0],pi:0,pt:1.4,sp:null,rot:0,flash:0,drip:0,dir:1,ry:162,r:96};
  b.img=even?SP.boss0:SP.boss1; b.imgF=even?SP.boss0F:SP.boss1F;
  b.name=even?'饕 餮':'墨 龙';
  b.hp=Math.round(760*(1+stage*0.52)); b.max=b.hp;
  return b;
}
function loadPhase(b){ b.pat=PHASE[b.ph]; b.pi=0; b.pt=1.1; b.sp=null; }
function bossAct(b,a){
  var i,n,ang,sp,d0,dir;
  if(a.k==='ring'){
    n=a.n+G.stage*2; sp=150+G.stage*10;
    for(i=0;i<n;i++){ ang=i/n*TAU+b.rot; eb(b.x+Math.cos(ang)*44,b.y+Math.sin(ang)*44,Math.cos(ang)*sp,Math.sin(ang)*sp,7,C.zs,0); }
    b.rot+=0.23; A.play('eshot');
  } else if(a.k==='aim'){
    n=a.n; d0=Math.atan2(P1.y-(b.y+30),P1.x-b.x); sp=214+G.stage*10;
    for(i=0;i<n;i++){ ang=d0+(i-(n-1)/2)*0.15; eb(b.x,b.y+30,Math.cos(ang)*sp,Math.sin(ang)*sp,6,C.zs,0); }
    A.play('eshot');
  } else if(a.k==='spiral'){
    b.sp={arms:a.arms||2,left:a.steps||24,ang:b.rot,t:0};
  } else if(a.k==='sweep'){
    n=9; sp=168; dir=b.dir>0?1:-1;
    for(i=0;i<n;i++) eb(b.x-dir*72,b.y-40+i*11,dir*sp*0.6,44,6,C.zsl,0);
    A.play('eshot');
  }
}
function spiralStep(b,dt){
  var s=b.sp, i, ang, sp=156+G.stage*8;
  s.t-=dt;
  if(s.t<=0&&s.left>0){
    s.t=0.075; s.left--; s.ang+=0.29;
    for(i=0;i<s.arms;i++){ ang=s.ang+i/s.arms*TAU; eb(b.x+Math.cos(ang)*40,b.y+Math.sin(ang)*40,Math.cos(ang)*sp,Math.sin(ang)*sp,6,C.zs,0); }
    A.play('eshot');
  }
  if(s.left<=0) b.sp=null;
}
function updBoss(b,dt){
  b.t+=dt; if(b.flash>0) b.flash-=dt;
  if(b.dying>0){
    b.dying-=dt;
    b.x+=RR(-1,1)*0.6; b.y+=0.4;
    if(R()<0.5) addSplat(b.x+RR(-80,80), b.y+RR(-40,60), RR(0.5,1.0), C.ink);
    if(b.dying<=0) bossKill(b);
    return;
  }
  if(b.intro>0){
    b.intro-=dt;
    b.y=lerp(b.y,b.ry,1-Math.pow(0.03,dt));
    if(R()<0.4) addDrip(b.x+RR(-90,90), b.y+RR(60,100));
    if(b.intro<=0){ b.pt=1.1; A.setIntensity(1); A.setTempo(112); }
    return;
  }
  var sp=b.ph===0?62:(b.ph===1?88:120);
  b.x+=b.dir*sp*dt;
  if(b.x<112||b.x>P.w-112){ b.dir*=-1; b.x=clamp(b.x,112,P.w-112); }
  b.y=b.ry+Math.sin(b.t*1.1)*11;
  b.drip-=dt; if(b.drip<=0){ b.drip=0.2; addDrip(b.x+RR(-88,88), b.y+92); }
  var f=b.hp/b.max, np=f>0.66?0:(f>0.33?1:2);
  if(np>b.ph){ b.ph=np; loadPhase(b); A.play('phase'); G.shake=Math.max(G.shake,10); addRing(b.x,b.y,300,SP.ringZs,0.8); }
  if(b.sp) spiralStep(b,dt);
  b.pt-=dt;
  if(b.pt<=0&&!b.sp){ b.pt=b.pat[b.pi].d; bossAct(b,b.pat[b.pi]); b.pi=(b.pi+1)%b.pat.length; }
}
function hurtBoss(dmg,x,y){
  var b=G.boss; if(!b||b.dying>0) return;
  b.hp-=dmg; b.flash=0.06;
  addDot2(x==null?b.x:x, y==null?b.y:y);
  if(dmg<6) A.play('hit');
  if(b.hp<=0){
    b.hp=0; b.dying=1.7;
    A.play('boomBig'); A.play('phase');
    G.shake=24; G.flood=Math.max(G.flood,0.5);
    for(var i=0;i<Math.min(G.eb.length,50);i++) addGem(G.eb[i].x,G.eb[i].y,100);
    G.eb.length=0;
    for(i=0;i<8;i++) setTimeoutish(i);
    G.score+=3000*(1+G.stage);
    dropItem(b.x,b.y,'b');
  }
}
function setTimeoutish(i){ /* 墨爆分帧 */
  setTimeout(function(){
    if(G.boss&&G.boss.dying>0) addSplat(G.boss.x+RR(-110,110), G.boss.y+RR(-60,70), RR(0.6,1.25), R()<0.35?C.hq:C.ink);
  }, 60+i*170);

function bossKill(b){
  A.setIntensity(0); A.setTempo(96);

  addSplat(b.x,b.y,2.6,C.ink);
  G.boss=null; G.clearT=2.5; G.mode='clear'; A.play('clear');

/* ---------- 波次 ---------- */
function doForm(e){
  var i,n,x,y,M=G.stage*0.85+G.wave*0.2, sp=e.spread||0.88;
  switch(e.fx){
    case 'line':
      n=e.n||5;
      if(n>1) for(i=0;i<n;i++) spawn(e.type, P.w*(1-sp)/2+(P.w*sp)*i/(n-1), -40-R()*40);
      else spawn(e.type, P.w*0.5, -40);
      break;
    case 'vee':
      n=e.n||4;
      for(i=0;i<n;i++) (function(j){
        at(0.13*j, function(){ spawn('crane', P.w*0.5+(j-(n-1)/2)*58, -40-j*30, {ph:j*0.7}); });
      })(i);
      break;
    case 'stream':
      n=e.n||6;
      for(i=0;i<n;i++) (function(j){
        at(0.17*j, function(){
          spawn(e.type, e.side<0?R()*P.w*0.22:P.w-R()*P.w*0.22, -30, {bx:e.side<0?R()*P.w*0.22:P.w-R()*P.w*0.22, curve:e.side*82});
        });
      })(i);
      break;
    case 'arc':
      n=e.n||2;
      for(i=0;i<n;i++) (function(j){
        at(0.42*j, function(){
          var sd=(j%2)?1:-1;
          spawn(e.type, sd<0?46:P.w-46, -30, {bx:sd<0?46:P.w-46, dir:-sd, curve:sd*86});
        });
      })(i);
      break;
    case 'drop':
      spawn('flag', P.w*(e.x||0.5), -40, {y0:150+R()*70});
      break;
  }
}
function buildWave(){
  var q=[], t=0.5, groups=3+Math.min(3,G.wave>>1), k, r, n, tanky=(G.stage>=1||G.wave>=2), e;
  function push(o){ o.t=t; q.push(o); }
  for(k=0;k<groups;k++){
    r=R();
    if(r<0.26){ n=4+Math.min(6,(G.stage+G.wave*0.6)|0); push({type:(tanky&&R()<0.4)?'armor':'crane',fx:'line',n:n,spd:76+G.stage*9+G.wave*4}); t+=1.15+R()*0.5; }
    else if(r<0.48){ n=5+Math.min(7,(G.stage+G.wave*0.5)|0); push({type:'moth',fx:'stream',n:n,side:R()<0.5?-1:1}); t+=1.6+R()*0.6; }
    else if(r<0.70){ n=3+Math.min(4,(G.stage+G.wave*0.4)|0); push({type:'crane',fx:'vee',n:n}); t+=1.5+R()*0.5; }
    else if(r<0.87&&tanky){ n=2+Math.min(3,(G.stage*0.7+G.wave*0.25)|0); push({type:'armor',fx:'arc',n:n}); t+=1.9; }
    else { push({type:'flag',fx:'drop',x:0.22+R()*0.56}); t+=2.3; }
  }
  if(G.wave>=3) push({t:t+0.7,type:'moth',fx:'stream',n:6,side:R()<0.5?-1:1});
  G.waveQ=q; G.waveI=0; G.waveT=0;
}
function beginWave(){
  if(G.wave>=4){ startBoss(); return; }
  buildWave();
  G.mode='play';
}
function runWave(dt){
  G.waveT+=dt;
  while(G.waveI<G.waveQ.length&&G.waveQ[G.waveI].t<=G.waveT) doForm(G.waveQ[G.waveI++]);
  if(G.waveI>=G.waveQ.length&&G.enemies.length===0) waveEnd();
}
function waveEnd(){
  if(G.wave>=4) return;
  G.wave++; G.between=1.2; G.mode='between';

}
function nextStage(){

/* ---------- 玩家 ---------- */
function firePlayer(){
  var p=P1, lv=G.weapon, y=p.y-24, i;
  switch(lv){
    case 1: pb(p.x,y,0,-665,3,1,C.hql,0); break;
    case 2: pb(p.x-9,y+5,-42,-645,3,1,C.hql,0); pb(p.x+9,y+5,42,-645,3,1,C.hql,0); break;
    case 3: pb(p.x,y-4,0,-700,3,2,C.hql,0); pb(p.x-15,y+7,-98,-615,3,1,C.hq,0); pb(p.x+15,y+7,98,-615,3,1,C.hq,0); break;
    case 4:
      for(i=-2;i<=2;i++) pb(p.x+i*11,y+5,i*80,-566-i*i*8,3,1,C.hq,0);
      pb(p.x,y-8,0,-730,4,3,C.hql,1);
      break;
    default:
      for(i=-3;i<=3;i++) pb(p.x+i*12,y+9,i*68,-524-Math.abs(i)*11,3,1,C.hq,0);
      pb(p.x-17,y+2,-34,-706,3,2,C.hql,0); pb(p.x+17,y+2,34,-706,3,2,C.hql,0);
      pb(p.x,y-10,0,-775,5,4,C.hql,1);
      break;
  }
  A.play('shot');
  if(R()<0.5) fx({t:'flick',x:p.x+RR(-4,4),y:p.y-30,r:RR(14,22),life:0.1,max:0.1,rot:0});
}
function useBomb(){
  if(G.bombs<=0) return;
  G.bombs--;
  A.play('bomb'); G.shake=20; G.flood=Math.max(G.flood,0.8);
  G.invuln=Math.max(G.invuln,1.7);
  fx({t:'ring',x:P1.x,y:P1.y,r:520,life:0.75,max:0.75,img:SP.ringZs});
  fx({t:'ring',x:P1.x,y:P1.y,r:340,life:0.55,max:0.55,img:SP.ring});
  var i,n=Math.min(G.eb.length,48);
  for(i=0;i<n;i++) addGem(G.eb[i].x,G.eb[i].y,100);
  G.eb.length=0;
  for(i=0;i<G.enemies.length;i++) hurtEnemy(G.enemies[i], 42+G.weapon*16,G.enemies[i].x,G.enemies[i].y);
  if(G.boss) hurtBoss(130+G.weapon*34);
  syncHud(true);
}
function playerHurt(){
  if(G.invuln>0) return;
  if(G.lives<=0||G.mode==='over'||G.mode==='menu') return;
  G.lives--; G.combo=0; G.comboT=0; G.invuln=2.4;
  A.play('die'); G.shake=Math.max(G.shake,15); G.hurtT=0.7;
  addSplat(P1.x,P1.y,1.5,C.ink); addSplatHq(P1.x,P1.y,1.2);
  dropItem(P1.x,P1.y);
  syncHud(true);
  if(G.lives<=0) gameOver();
}
function pickup(it){
  if(it.type==='w'){
    if(G.weapon<5){ G.weapon++; A.play('power'); }
    else { G.score+=600; A.play('gem'); }
  } else if(it.type==='s'){ G.shield=12; A.play('shield'); }
  else if(it.type==='b'){ if(G.bombs<3) G.bombs++; A.play('seal'); }
  else { G.score+=it.val; A.play('gem'); }
  addRing(P1.x,P1.y,64, it.type==='b'?SP.ringZs:SP.ring);
  syncHud(true);
}
function updPlayer(dt){
  var p=P1, focus=!!(KEY.ShiftLeft||KEY.ShiftRight);
  p.t+=dt;
  if(G.invuln>0) G.invuln-=dt;
  if(G.shield>0) G.shield-=dt;
  var sp=(focus?230:600);
  var dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy), step=sp*dt;
  if(d>0.001){ if(d<=step){ p.x=p.tx; p.y=p.ty; } else { p.x+=dx/d*step; p.y+=dy/d*step; } }
  p.x=clamp(p.x,16,P.w-16); p.y=clamp(p.y,26,P.h-30);
  p.trail-=dt;
  if(p.trail<=0&&G.mode!=='menu'){ p.trail=0.032; wg.globalAlpha=0.5; wg.drawImage(SP.wetDot,p.x-18,p.y-8,36,16); wg.globalAlpha=1; }
  p.fire-=dt;
  if(p.fire<=0){ p.fire=G.weapon>=5?0.082:(G.weapon>=3?0.096:0.115); firePlayer(); }
}

/* ---------- 道具 ---------- */
function updItems(dt){
  for(var i=G.items.length-1;i>=0;i--){
    var it=G.items[i];
    it.t+=dt; it.life-=dt;
    it.y+=it.vy*dt;
    it.x+=Math.sin(it.t*2.1+it.ph)*34*dt;
    it.x=clamp(it.x,20,P.w-20);
    if(it.life<=0||it.y>P.h+40){ G.items.splice(i,1); continue; }
    var dx=it.x-P1.x, dy=it.y-P1.y;
    if(dx*dx+dy*dy<30*30){ pickup(it); G.items.splice(i,1); }
  }
}

/* ---------- 主更新 ---------- */
function update(dt){
  G.t+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*42);
  if(G.hurtT>0) G.hurtT-=dt;
  if(G.flood>0) G.flood=Math.max(0,G.flood-dt*1.5);
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) G.combo=0; }

  for(var i=G.sched.length-1;i>=0;i--) if(G.t>=G.sched[i].t){ var f=G.sched[i].fn; G.sched.splice(i,1); f(); }

  if(G.mode==='play'||G.mode==='boss'||G.mode==='between'||G.mode==='clear'){
    updPlayer(dt);
    if(G.between>0){ G.between-=dt; if(G.between<=0) beginWave(); }
    if(G.mode==='play') runWave(dt);
    if(G.mode==='clear'){ G.clearT-=dt; if(G.clearT<=0){ nextStage(); } }
    if(G.boss) updBoss(G.boss,dt);
  } else if(G.mode==='menu'){
    /* 菜单也让纸鸢微微浮动 */
    P1.x=P.w*0.5+Math.sin(G.t*0.8)*40; P1.y=P.h*0.72+Math.sin(G.t*1.3)*8;
  }

  /* 敌 */
  for(i=0;i<G.enemies.length;i++) if(!G.enemies[i].dead) updEnemy(G.enemies[i],dt);
  /* 弹 */
  for(i=G.pb.length-1;i>=0;i--){
    var b=G.pb[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0||b.y<-40||b.y>P.h+40||b.x<-40||b.x>P.w+40){ G.pb.splice(i,1); continue; }
    var j,hit=0;
    for(j=0;j<G.enemies.length;j++){
      var e=G.enemies[j]; if(e.dead) continue;
      var ex=b.x-e.x, ey=b.y-e.y, rr=b.r+e.r;
      if(ex*ex+ey*ey<rr*rr){ hurtEnemy(e,b.d,b.x,b.y); b.dead=1; hit=1; break; }
    }
    if(!hit&&G.boss&&!G.boss.dying&&G.boss.intro<=0){
      var bo=G.boss, bx=b.x-bo.x, by=b.y-bo.y, br=b.r+bo.r;
      if(bx*bx+by*by<br*br){ hurtBoss(b.d,b.x,b.y); b.dead=1; }
    }
    if(b.dead) G.pb.splice(i,1);
  }
  for(i=G.eb.length-1;i>=0;i--){
    var q=G.eb[i];
    q.x+=q.vx*dt; q.y+=q.vy*dt; q.t+=dt;
    if(q.x<-40||q.x>P.w+40||q.y<-60||q.y>P.h+60){ G.eb.splice(i,1); continue; }
    if(G.invuln<=0){
      var qx=q.x-P1.x, qy=q.y-P1.y, qr=q.r+P1.r;
      if(qx*qx+qy*qy<qr*qr){
        if(G.shield>0){
          G.shield-=0.32; A.play('block');
          addDot2(q.x,q.y);
          G.eb.splice(i,1); continue;
        }
        G.eb.splice(i,1); playerHurt();
      }
    }
  }
  for(i=G.enemies.length-1;i>=0;i--){
    var en=G.enemies[i];
    if(en.dead){ G.enemies.splice(i,1); continue; }
    if(G.invuln<=0&&G.mode!=='clear'){
      var cx=en.x-P1.x, cy=en.y-P1.y, cr=en.r*0.78+P1.r;
      if(cx*cx+cy*cy<cr*cr) playerHurt();
    }
  }
  updItems(dt);
  /* 特效 */
  for(i=G.fx.length-1;i>=0;i--){
    var f=G.fx[i];
    f.life-=dt;
    if(f.vx!==undefined){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=0.965; f.vy*=0.965; }
    if(f.rot!==undefined&&f.vr!==undefined) f.rot+=f.vr*dt;
    if(f.t==='drip'){ f.y+=260*dt; }
    if(f.life<=0) G.fx.splice(i,1);
  }
  /* 环境墨点 */
  for(i=0;i<MOTES.length;i++){
    var m=MOTES[i];
    m.y+=m.vy*dt; m.x+=Math.sin(G.t*0.7+m.ph)*6*dt;
    if(m.y<-6){ m.y=P.h+6; m.x=R()*P.w; }
  }
  if(wg){ wg.globalCompositeOperation='destination-out'; wg.fillStyle='rgba(0,0,0,.055)'; wg.fillRect(0,0,P.w,P.h); wg.globalCompositeOperation='source-over'; }
  if(G.mode==='play'||G.mode==='boss'||G.mode==='between'||G.mode==='clear') syncHud(false);
}

/* ---------- 绘制 ---------- */
function drawBg(){
  var ov=30;
  for(var i=0;i<LS.length;i++){
    if(!LS[i].cv) continue;
    var t=LS[i].cv, H=P.h;
    var y=-(((LOFF[i]%H)+H)%H);
    g.drawImage(t,-ov,y-ov,P.w+ov*2,P.h+ov*2);
    g.drawImage(t,-ov,y+H-ov,P.w+ov*2,P.h+ov*2);
  }
  for(var j=0;j<MOTES.length;j++){
    var m=MOTES[j];
    g.globalAlpha=m.a; g.drawImage(SP.dotInk2,m.x-m.r,m.y-m.r,m.r*2,m.r*2);
  }
  g.globalAlpha=1;
  if(!G.noWet && wet){ g.globalCompositeOperation='multiply'; g.globalAlpha=0.55; g.drawImage(wet,0,0); g.globalAlpha=1; g.globalCompositeOperation='source-over'; }
}
function drawSprite(img,x,y,sc,rot,alpha){
  if(alpha!==undefined&&alpha<=0.004) return;
  if(alpha!==undefined) g.globalAlpha=alpha;
  if(rot){ g.save(); g.translate(x,y); g.rotate(rot); g.drawImage(img,-img.width*sc/2,-img.height*sc/2,img.width*sc,img.height*sc); g.restore(); }
  else g.drawImage(img,x-img.width*sc/2,y-img.height*sc/2,img.width*sc,img.height*sc);
  if(alpha!==undefined) g.globalAlpha=1;
}
function drawItems(){
  for(var i=0;i<G.items.length;i++){
    var it=G.items[i], img=it.type==='w'?SP.itInk:it.type==='s'?SP.itStone:it.type==='b'?SP.itBomb:SP.itGem;
    var bob=Math.sin(it.t*2.4+it.ph)*3;
    var blink=(it.life<2.6&&Math.floor(it.life*7)%2===0)?0.32:1;
    g.globalAlpha=0.10*blink;
    g.drawImage(SP.wetDot,it.x-24,it.y-14+bob,48,28);
    g.globalAlpha=0.22*blink;
    g.drawImage(SP.dotInk2,it.x-15,it.y-15+bob,30,30);
    g.globalAlpha=1;
    drawSprite(img,it.x,it.y+bob,1,Math.sin(it.t*1.3+it.ph)*0.08,blink);
  }
}
function drawEnemies(){
  for(var i=0;i<G.enemies.length;i++){
    var e=G.enemies[i];
    var img=SP[e.type]||SP.crane, f=SP[e.type+'F'];
    var sc=(e.type==='flag')?0.86:1;
    var rot=Math.sin(e.t*0.8+e.ph)*0.05;
    drawSprite(img,e.x,e.y,sc,rot);
    if(e.flash>0&&f) drawSprite(f,e.x,e.y,sc,rot,clamp(e.flash/0.1,0,1)*0.6);
    if(e.hp<e.maxhp&&e.maxhp>6){
      var w=e.r*1.7, f2=e.hp/e.maxhp;
      g.globalAlpha=0.5; g.fillStyle=C.ink2; g.fillRect(e.x-w/2,e.y-e.r-9,w,2.2); g.globalAlpha=1;
      g.fillStyle=C.zs; g.fillRect(e.x-w/2,e.y-e.r-9,w*f2,2.2);
    }
  }
}
function drawBoss(){
  var b=G.boss; if(!b) return;
  var sc=Math.min(P.w/380, 0.98);
  var pulse=0.5+0.5*Math.sin(b.t*1.6);
  g.globalAlpha=(b.dying>0?0.4:0.10+pulse*0.10);
  var as=1.15+pulse*0.14;
  g.drawImage(SP.aura,b.x-P.w*as/2,b.y-P.w*as/2,P.w*as,P.w*as);
  g.globalAlpha=1;
  g.save(); g.translate(b.x,b.y); g.rotate(Math.sin(b.t*0.7)*0.03);
  /* 底图常驻，受击只是叠一层淡白，不许把 Boss 糊没 */
  g.drawImage(b.img,-b.img.width*sc/2,-b.img.height*sc/2,b.img.width*sc,b.img.height*sc);
  if(b.flash>0){
    g.globalAlpha=clamp(b.flash/0.06,0,1)*0.55;
    g.drawImage(b.imgF,-b.img.width*sc/2,-b.img.height*sc/2,b.img.width*sc,b.img.height*sc);
    g.globalAlpha=1;
  }
  g.restore();
  /* 相位裂纹 */
  if(b.ph>0&&b.dying<=0){
    g.strokeStyle='rgba(20,18,14,'+(0.16+b.ph*0.10)+')'; g.lineWidth=1.6; g.lineCap='round';
    for(var i=0;i<4+b.ph*3;i++){
      var a=(i*1.37)%TAU, r0=b.r*(0.42+(i%3)*0.1), r1=b.r*(0.78+(i%2)*0.16);
      g.beginPath(); g.moveTo(b.x+Math.cos(a)*r0,b.y+Math.sin(a)*r0);
      g.lineTo(b.x+Math.cos(a+0.12)*r1,b.y+Math.sin(a+0.12)*r1); g.stroke();
    }
  }
  drawRail(b);
}
function drawRail(b){
  var x=14,y0=64,y1=P.h-84,w=12,f=b.hp/b.max,len=y1-y0;
  g.fillStyle='rgba(246,240,228,.55)'; g.fillRect(x,y0,w,len);
  g.strokeStyle='rgba(40,34,24,.45)'; g.lineWidth=1; g.strokeRect(x+0.5,y0+0.5,w,len);
  var grd=g.createLinearGradient(0,y0,0,y1);
  grd.addColorStop(0,'rgba(22,20,16,.88)'); grd.addColorStop(1,'rgba(42,86,112,.72)');
  g.fillStyle=grd; g.fillRect(x+1.5,y0+1.5,w-3,len*f);
  var t2;
  for(var i=0;i<2;i++){ t2=[0.33,0.66][i];
    g.fillStyle=(f<=t2)?'rgba(200,57,44,.92)':'rgba(120,64,52,.34)';
    g.fillRect(x-4,y0+len*t2,4,w+8);
  }
}
function drawPlayer(){
  var p=P1;
  if(G.mode==='menu'){ drawSprite(SP.plane,p.x,p.y,1,Math.sin(p.t)*0.05); return; }
  var blink=G.invuln>0?(Math.sin(G.t*26)>0?0.32:0.95):1;
  if(G.shield>0){
    var s=1+0.06*Math.sin(G.t*5);
    g.globalAlpha=0.5+0.18*Math.sin(G.t*3.4);
    g.save(); g.translate(p.x,p.y); g.rotate(G.t*0.7);
    g.drawImage(SP.ring,-46*s,-46*s,92*s,92*s); g.restore();
    g.globalAlpha=1;
  }
  drawSprite(SP.plane,p.x,p.y,1,clamp((p.tx-p.x)*0.0006,-0.16,0.16),blink);
  /* 判定点：一直可见，定身时更清楚 */
  g.globalAlpha=(KEY.ShiftLeft||KEY.ShiftRight)?0.95:0.42;
  g.fillStyle='rgba(250,246,238,.95)'; g.beginPath(); g.arc(p.x,p.y+4,4.4,0,TAU); g.fill();
  g.fillStyle='rgba(24,22,18,.92)'; g.beginPath(); g.arc(p.x,p.y+4,2.3,0,TAU); g.fill();
  g.globalAlpha=1;
}
function drawBullets(){
  var i,b;
  for(i=0;i<G.pb.length;i++){
    b=G.pb[i];
    g.drawImage(b.kind===1?SP.dotHq:SP.dotInk,b.x-b.r*1.6,b.y-b.r*1.6,b.r*3.2,b.r*3.2);
  }
  for(i=0;i<G.eb.length;i++){
    b=G.eb[i];
    var img=(b.kind===1||b.c===C.zsl)?SP.dotZs2:SP.dotZs, r=b.r;
    g.save(); g.translate(b.x,b.y);
    g.drawImage(img,-r*1.7,-r*1.7,r*3.4,r*3.4);
    g.restore();
  }
}
function drawFx(){
  for(var i=0;i<G.fx.length;i++){
    var f=G.fx[i], t=1-f.life/f.max, s;
    g.globalAlpha=clamp(1-t*t,0,1)*(f.a==null?1:f.a);
    if(f.t==='splat'){ s=f.r*(0.42+t*1.45)*2;
      g.save(); g.translate(f.x,f.y); if(f.rot) g.rotate(f.rot);
      g.drawImage(f.img,-s/2,-s/2,s,s); g.restore(); }
    else if(f.t==='dot'){ g.drawImage(f.img,f.x-f.r,f.y-f.r,f.r*2,f.r*2); }
    else if(f.t==='flick'){ g.save(); g.translate(f.x,f.y); g.rotate(f.rot); g.drawImage(SP.streak,-f.r,-f.r*0.3,f.r*2,f.r*0.6); g.restore(); }
    else if(f.t==='ring'){ s=f.r*(0.25+t*1.25); g.drawImage(f.img,f.x-s,f.y-s,s*2,s*2); }
    else if(f.t==='drip'){ g.save(); g.translate(f.x,f.y); g.drawImage(SP.dotInk,-f.r*0.7,-f.r*1.4,f.r*1.4,f.r*2.8); g.restore(); }
    g.globalAlpha=1;
  }
}
function draw(){
  var k=cv.width/P.w, sh=G.shake;
  var ox=sh?RR(-sh,sh):0, oy=sh?RR(-sh,sh):0;
  /* 纸底在不抖动的坐标系里铺满：震屏时不会被偏移切出残边 */
  g.setTransform(k,0,0,k,0,0);
  g.fillStyle=paperPat; g.fillRect(0,0,P.w,P.h);
  g.setTransform(k,0,0,k,ox*k,oy*k);
  drawBg();
  drawItems();
  if(G.boss) drawBoss();
  drawEnemies();
  drawPlayer();
  drawBullets();
  drawFx();
  /* 受创：朱砂从纸边洇进来 */
  if(G.hurtT>0){
    var h=G.hurtT/0.7, gr=g.createRadialGradient(P.w*0.5,P.h*0.5,P.h*0.28,P.w*0.5,P.h*0.5,P.h*0.72);
    gr.addColorStop(0,'rgba(200,57,44,0)'); gr.addColorStop(1,'rgba(200,57,44,'+(0.30*h).toFixed(3)+')');
    g.fillStyle=gr; g.fillRect(0,0,P.w,P.h);
  }
  /* 留白漫过纸面（清卷 / 掷符） */
  if(G.flood>0){
    g.globalAlpha=clamp(G.flood*0.82,0,1);
    g.fillStyle='#f7f1e4'; g.fillRect(0,0,P.w,P.h);
    g.globalAlpha=1;
  }
}

  var i,html='';
  for(i=0;i<3;i++) html+='<div class="life"></div>';
  el.lives.innerHTML=html;
  html='';
  for(i=0;i<5;i++) html+='<div class="pip"></div>';
  el.weap.innerHTML=html;
}
function calcSize(){
  var vw=window.innerWidth, vh=window.innerHeight, narrow=vw<640;
  var ml=narrow?20:60, mr=narrow?70:106;
  var availW=Math.max(200,vw-ml-mr-(narrow?8:36));
  var availH=Math.max(260,vh-(narrow?42:60));
  var asp=clamp(availW/availH,0.46,1.32);
  var W=480, H=clamp(Math.round((480/asp)/8)*8,600,1080);
  var s=Math.min(availW/W, availH/H);
  return {W:W,H:H,ml:ml,mr:mr,
    pw:Math.max(180,Math.round(W*s)), ph:Math.max(240,Math.round(H*s))};
}
function applySize(sz){
  el.stage.style.width=sz.pw+'px'; el.stage.style.height=sz.ph+'px';
  document.documentElement.style.setProperty('--ml',sz.ml+'px');
  document.documentElement.style.setProperty('--mr',sz.mr+'px');
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var bw=Math.round(sz.pw*dpr), bh=Math.round(sz.ph*dpr);
  if(el.cv.width!==bw||el.cv.height!==bh){ el.cv.width=bw; el.cv.height=bh; }
  g=el.cv.getContext('2d');
  P1.x=clamp(P1.x,16,P.w-16); P1.y=clamp(P1.y,26,P.h-30);
  P1.tx=clamp(P1.tx,16,P.w-16); P1.ty=clamp(P1.ty,26,P.h-30);
  if(G.boss){ G.boss.x=clamp(G.boss.x,112,P.w-112); G.boss.ry=clamp(G.boss.ry,90,P.h*0.24); }
}
function layout(){
  var sz=calcSize(), changed=(sz.W!==P.w||sz.H!==P.h);
  P.w=sz.W; P.h=sz.H;
  if(changed) buildScene();
  applySize(sz);
}
function showCard(tx,zhu){
  el.cardTx.textContent=tx;
  el.card.classList.toggle('zhu',!!zhu);
  el.card.classList.remove('run');
  void el.card.offsetWidth;
  el.card.classList.add('run');
}
function syncHud(force){
  if(!force&&(G.t-hudT)<0.09) return;
  hudT=G.t;
  el.score.textContent=G.score;
  el.wave.textContent=G.boss?G.boss.name:(cn(G.stage+1)+'·'+cn(G.wave+1));
  var i,ls=el.lives.children;
  for(i=0;i<ls.length;i++) ls[i].className='life'+(i<G.lives?'':' off');
  var ps=el.weap.children;
  for(i=0;i<ps.length;i++) ps[i].className='pip'+(i<G.weapon?' on':'');
  el.seal.className='seal'+(G.bombs>0?' ready':' empty');
  el.seal.lastChild.textContent=G.bombs;
  if(G.combo>=2){ el.combo.className='combo on'; el.combo.lastChild.textContent=G.combo; }
  else el.combo.className='combo';
}
function panelShow(p){ p.classList.add('on'); }
function panelHide(p){ p.classList.remove('on'); }

function startGame(){
  if(!G.ready) return;
  RND=mulberry32(SEED);
  G.stage=0; G.wave=0; G.score=0; G.combo=0; G.comboT=0; G.maxCombo=0; G.kills=0;
  G.lives=3; G.weapon=1; G.bombs=1; G.shield=0; G.invuln=1.4;
  G.enemies.length=0; G.pb.length=0; G.eb.length=0; G.items.length=0; G.fx.length=0; G.sched.length=0;
  G.boss=null; G.between=0.9; G.clearT=0; G.flood=0; G.shake=0; G.hurtT=0;
  P1.x=P1.tx=P.w*0.5; P1.y=P1.ty=P.h*0.76;
  G.mode='between';
  A.unlock(); A.setIntensity(0); A.setTempo(96);
  showCard('第一卷 · '+STAGE_NAME[0]);
  panelHide(el.pStart); panelHide(el.pOver); panelHide(el.pPause);
  syncHud(true);
}
function toMenu(){
  G.mode='menu'; G.boss=null; G.enemies.length=0; G.eb.length=0; G.pb.length=0; G.fx.length=0;
  G.flood=0; G.shake=0; G.clearT=0;
  A.setIntensity(0);
  panelHide(el.pOver); panelHide(el.pPause); panelShow(el.pStart);
  syncHud(true);
}
function gameOver(){
  if(G.mode==='over') return;
  G.mode='over';
  A.setIntensity(0); A.play('over');
  if(G.score>G.best){ G.best=G.score; try{ localStorage.setItem('moyuan.best',G.best); }catch(e){} }
  el.oScore.textContent=G.score; el.oBest.textContent=G.best;
  el.oCombo.textContent=G.maxCombo; el.oWave.textContent=cn(G.stage+1)+'·'+cn(G.wave+1);
  panelShow(el.pOver);
  syncHud(true);
}
function togglePause(on){
  if(G.mode==='menu'||G.mode==='over') return;
  if(on){
    if(G.mode==='pause') return;
    G._pm=G.mode; G.mode='pause';
    panelShow(el.pPause);
    if(A.ac) A.master.gain.setTargetAtTime(0.0001,A.ac.currentTime,0.04);
  } else {
    if(G.mode!=='pause') return;
    G.mode=G._pm||'play';
    panelHide(el.pPause);
    if(A.ac&&A.on) A.master.gain.setTargetAtTime(0.9,A.ac.currentTime,0.06);
  }
}
function toggleMute(){
  A.mute(A.on);
  el.btnMute.classList.toggle('off',!A.on);
}
function showFatal(){
  if(el.fatal&&el.fatal.style.display!=='block'&&ERRORS.length){
    el.fatal.style.display='block';
    el.fatal.textContent='出了点岔子（可截图反馈）：\n'+ERRORS.join('\n');
  }
}

/* ---------- 输入 ---------- */
function stagePt(ev){
  var r=el.cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)/r.width*P.w, y:(ev.clientY-r.top)/r.height*P.h };
}
function keyAxis(dt){
  var kx=0,ky=0,s=(KEY.ShiftLeft||KEY.ShiftRight)?250:430;
  if(KEY.ArrowLeft||KEY.KeyA) kx-=1;
  if(KEY.ArrowRight||KEY.KeyD) kx+=1;
  if(KEY.ArrowUp||KEY.KeyW) ky-=1;
  if(KEY.ArrowDown||KEY.KeyS) ky+=1;
  if(kx||ky){ P1.tx=clamp(P1.tx+kx*s*dt,16,P.w-16); P1.ty=clamp(P1.ty+ky*s*dt,26,P.h-30); }
}
function bind(){
  var s=el.stage;
  s.addEventListener('pointerdown',function(ev){
    A.unlock();
    if(G.mode==='menu'||G.mode==='over'||G.mode==='pause') return;
    dragging=true;
    if(s.setPointerCapture) try{ s.setPointerCapture(ev.pointerId); }catch(e){}
    var p=stagePt(ev);
    P1.tx=clamp(p.x,16,P.w-16);
    P1.ty=clamp(p.y-(ev.pointerType==='touch'?46:0),26,P.h-30);
    ev.preventDefault();
  });
  s.addEventListener('pointermove',function(ev){
    if(!dragging) return;
    var p=stagePt(ev);
    P1.tx=clamp(p.x,16,P.w-16);
    P1.ty=clamp(p.y-(ev.pointerType==='touch'?46:0),26,P.h-30);
    ev.preventDefault();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(k){
    s.addEventListener(k,function(){ dragging=false; });
  });
  window.addEventListener('keydown',function(ev){
    KEY[ev.code]=true;
    A.unlock();
    if(ev.code==='Space'){ ev.preventDefault(); if(!ev.repeat&&(G.mode==='play'||G.mode==='boss'||G.mode==='between')) useBomb(); }
    else if(ev.code==='KeyP'||ev.code==='Escape'){ if(!ev.repeat) togglePause(G.mode!=='pause'); }
    else if(ev.code==='KeyM'){ if(!ev.repeat) toggleMute(); }
    else if(ev.code==='Enter'){ if(!ev.repeat){ if(G.mode==='menu'||G.mode==='over') startGame(); else if(G.mode==='pause') togglePause(false); } }
    else if(ev.code==='ArrowUp'||ev.code==='ArrowDown'||ev.code==='ArrowLeft'||ev.code==='ArrowRight') ev.preventDefault();
  });
  window.addEventListener('keyup',function(ev){ KEY[ev.code]=false; });
  window.addEventListener('resize',function(){ clearTimeout(bind._t); bind._t=setTimeout(layout,140); });
  window.addEventListener('orientationchange',function(){ setTimeout(layout,260); });
  document.addEventListener('visibilitychange',function(){ if(document.hidden&&(G.mode==='play'||G.mode==='boss'||G.mode==='between')) togglePause(true); });
  window.addEventListener('blur',function(){ dragging=false; });

  $('btnStart').addEventListener('click',function(e){ e.stopPropagation(); A.play('ui'); startGame(); });
  $('btnRetry').addEventListener('click',function(e){ e.stopPropagation(); A.play('ui'); startGame(); });
  $('btnMenu').addEventListener('click',function(e){ e.stopPropagation(); A.play('ui'); toMenu(); });
  $('btnResume').addEventListener('click',function(e){ e.stopPropagation(); A.play('ui'); togglePause(false); });
  $('btnQuit').addEventListener('click',function(e){ e.stopPropagation(); A.play('ui'); togglePause(true); toMenu(); });
  el.btnPause.addEventListener('click',function(){ A.play('ui'); togglePause(G.mode!=='pause'); });
  el.btnMute.addEventListener('click',function(){ A.unlock(); toggleMute(); });
  el.pStart.addEventListener('click',function(){ if(G.mode==='menu') startGame(); });
  el.pOver.addEventListener('click',function(){ if(G.mode==='over') startGame(); });
}

/* ---------- 主循环 ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  G.frames=(G.frames||0)+1;
  var dt=(ts-last)/1000; last=ts;
  if(!(dt>0)) dt=1/60;
  if(dt>0.05) dt=0.05;
  if(G.mode!=='pause'){ keyAxis(dt); update(dt); }
  draw();
  frames++;
  if(ts-fpsT>500){ fps=Math.round(frames*1000/(ts-fpsT)); frames=0; fpsT=ts; }
  if(ERRORS.length) showFatal();
}

function init(){
  cacheDom();
  var t0=performance.now();
  var m=/[?&]seed=(\d+)/.exec(location.search);
  SEED=m?parseInt(m[1],10):((Date.now()%900000)+1);
  RND=mulberry32(SEED);
  try{ G.best=parseInt(localStorage.getItem('moyuan.best')||'0',10)||0; }catch(e){ G.best=0; }
  cv=el.cv; g=cv.getContext('2d');
  var sz=calcSize(); P.w=sz.W; P.h=sz.H;
  el.stage.style.width=sz.pw+'px'; el.stage.style.height=sz.ph+'px';
  document.documentElement.style.setProperty('--ml',sz.ml+'px');
  document.documentElement.style.setProperty('--mr',sz.mr+'px');
  el.stage.classList.add('booting');
  bind();
  P1.x=P1.tx=P.w*0.5; P1.y=P1.ty=P.h*0.72;
  syncHud(true);
  /* 先让浏览器把「帖」画出来，再研墨 —— 慢机器上也不会白屏 */
  requestAnimationFrame(function(){
    setTimeout(function(){
      var t1=performance.now(); buildSprites();
      var t2=performance.now(); buildScene();
      var t3=performance.now(); applySize(sz);
      var t4=performance.now();
      G.timing={sprites:Math.round(t2-t1), scene:Math.round(t3-t2), layout:Math.round(t4-t3), total:Math.round(t4-t0)};
      G.ready=true;
      el.stage.classList.remove('booting');
      $('btnStart').disabled=false;
      P1.x=P1.tx=P.w*0.5; P1.y=P1.ty=P.h*0.72;
      syncHud(true);
      requestAnimationFrame(function(ts){ last=ts; fpsT=ts; requestAnimationFrame(loop); });
      if(/[?&]boss=1/.test(location.search)) setTimeout(function(){ startGame(); G.wave=4; G.between=0.05; },300);
    },0);
  });
}
window.__game={
  get state(){
    return { mode:G.mode, ready:!!G.ready, frames:G.frames|0, stage:G.stage, wave:G.wave, score:G.score, lives:G.lives, weapon:G.weapon,
      bombs:G.bombs, shield:+G.shield.toFixed(1), combo:G.combo, maxCombo:G.maxCombo, kills:G.kills,
      enemies:G.enemies.length, pb:G.pb.length, eb:G.eb.length, items:G.items.length, fx:G.fx.length,
      boss:G.boss?{hp:G.boss.hp,max:G.boss.max,ph:G.boss.ph,intro:+G.boss.intro.toFixed(2),dying:+(G.boss.dying||0).toFixed(2)}:null,
      fps:fps, errors:ERRORS.slice(), audio:A.ac?A.ac.state:'none', seed:SEED, w:P.w, h:P.h,
      timing:G.timing||null,
      px:Math.round(P1.x), py:Math.round(P1.y) };
  },
  start:startGame, bomb:useBomb, layout:layout,
  dbg:function(){
    var d=null;
    if(wet){ d=wet.getContext('2d').getImageData(0,0,wet.width,wet.height).data; }
    var s=0,n=0,o=0,px=null;
    if(d){ for(var i=3;i<d.length;i+=128){ s+=d[i]; n++; if(d[i]>8)o++; } }
    if(g){ var q=g.getImageData(6,6,1,1).data; px=[q[0],q[1],q[2],q[3]]; }
    return { paperOk:!!paperPat, wetW:wet?wet.width:0, wetH:wet?wet.height:0,
      wetAlpha:+(n?s/n:0).toFixed(1), wetCover:+(n?o/n:0).toFixed(3),
      cornerPixel:px, ga:g.globalAlpha, fill:String(g.fillStyle).slice(0,40) };
  },
  grant:function(l){ G.weapon=l||5; G.bombs=3; G.lives=3; G.invuln=999; syncHud(true); },
  jump:function(w){ G.enemies.length=0; G.eb.length=0; G.wave=w; G.between=0.06; G.mode='between'; },
  hurt:function(){ G.invuln=0; playerHurt(); },
  god:function(v){ G.invuln=v?999:0; }
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
</body>
