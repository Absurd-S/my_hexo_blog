<title>候鸟志 · AVES TRANSIT</title>
<style>
/* ============================================================
   候鸟志 — 单文件 H5
   视觉：维多利亚自然史图鉴 / 铜版雕刻（Natural History Engraving）

   FlappyBird 的原生世界是「鸟穿过障碍」。所以不做霓虹管道，
   做成一张**深色标本柜**里的一页铜版图版：
   · 障碍不是矩形管道，是一束束上下对生的**荻秆**——带节、有穗、
     自然弯曲；穗子一律朝内，正对着你要钻的那个缝。
   · 前景全是骨白墨线压在深橄榄绿底上；远景两层丘陵用极低透明度
     做纵深，和抽屉格线一起构成「柜内」的空气。
   · 版式是这套风格的招牌：**小型大写标签 + 拉丁双名法斜体 +
     图版编号**。分数不叫分数，叫「记录」，会推动图版号往上涨。
   · 朱砂色是全场唯一饱和色，只留给撞击和盖章。
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  /* 标本柜内衬：不是纯黑，是打过蜡的深橄榄木，偏绿 */
  --cab:    #0e1411;
  --cab-2:  #141c17;
  --cab-3:  #1b251e;
  --drawer: rgba(230, 221, 196, .045);

  /* 骨白：铜版画上那层薄墨 */
  --bone:    #e6ddc4;
  --bone-2:  #c9bfa2;
  --bone-3:  #9d967e;
  --bone-dim: rgba(230, 221, 196, .42);
  --bone-faint: rgba(230, 221, 196, .16);

  /* 铜：标签卡的框线、分隔线 */
  --copper:    #a8813f;
  --copper-hi: #c9a45c;

  /* 苔：远景丘陵 */
  --moss: #4a5a42;

  /* 朱砂：全场唯一饱和色。撞击、盖章、告警。 */
  --cinnabar: #b8402c;

  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino,
           Georgia, "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;

  --ease-out: cubic-bezier(.22, .68, .32, 1);
  --ease-snap: cubic-bezier(.34, 1.28, .46, 1);

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }

body {
  font-family: var(--serif);
  color: var(--bone);
  background-color: var(--cab);
  background-image:
    radial-gradient(122% 80% at 50% -18%, #17211a 0%, rgba(23, 33, 26, 0) 62%),
    radial-gradient(96% 66% at 6% 112%, #101a15 0%, rgba(16, 26, 21, 0) 70%),
    linear-gradient(178deg, #121a15 0%, #0b100d 100%);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  position: relative;
}

/* 纸纹：一次性生成的噪点瓦片，叠在最上层做印刷颗粒 */
.grain {
  position: fixed; inset: 0; z-index: 40; pointer-events: none;
  background-repeat: repeat; background-size: 128px 128px;
  opacity: .38; mix-blend-mode: overlay;
}
.vignette {
  position: fixed; inset: 0; z-index: 39; pointer-events: none;
  background: radial-gradient(78% 58% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.32) 100%);
}

/* ---------- 画布 ----------
   尺寸由 JS 按 460:720 精确算好再写进 style。
   纯 CSS 做不到：同时写 height:100% 和 max-width:100% 会让两个轴都成为确定值，
   此时 aspect-ratio 会被忽略，窄屏上画布直接被拉变形。 */
.stage {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding: calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b));
}
canvas {
  display: block;
  border-radius: 2px;
  box-shadow:
    0 0 0 1px rgba(230, 221, 196, .07),
    0 0 0 6px rgba(14, 20, 17, .55),
    0 26px 70px -20px rgba(0, 0, 0, .8);
  cursor: pointer;
}

/* ---------- 标本标签卡（HUD）---------- */
.plate {
  position: fixed; z-index: 20;
  top: calc(18px + var(--safe-t)); right: max(18px, calc(50% - 230px + 26px));
  width: 150px; padding: 11px 12px 10px;
  background:
    linear-gradient(174deg, rgba(230,221,196,.055), rgba(230,221,196,.02)),
    var(--cab-2);
  border: 1px solid rgba(168, 129, 63, .42);
  border-radius: 1px;
  box-shadow: inset 0 0 0 1px rgba(14, 20, 17, .7), 0 10px 26px -14px rgba(0,0,0,.9);
  pointer-events: none;
}
.plate::before {
  /* 铜版框线的内圈 */
  content: ''; position: absolute; inset: 3px;
  border: 1px solid rgba(168, 129, 63, .17); border-radius: 1px; pointer-events: none;
}
.plate__no {
  font: 600 8.5px/1 var(--serif);
  letter-spacing: .26em; text-transform: uppercase;
  color: var(--copper); opacity: .92;
  display: flex; justify-content: space-between; align-items: baseline;
}
.plate__no b { font-weight: 600; color: var(--copper-hi); letter-spacing: .1em; font-size: 10px; }
.plate__hr { height: 1px; background: rgba(168, 129, 63, .3); margin: 8px 0 7px; }
.plate__row {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 2.5px 0;
}
.plate__row span {
  font: 400 8.5px/1 var(--serif); letter-spacing: .24em;
  text-transform: uppercase; color: var(--bone-3);
}
.plate__row b {
  font: 600 21px/1 var(--serif); color: var(--bone);
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
  text-shadow: 0 1px 0 rgba(0,0,0,.6);
}
.plate__row--sub b { font-size: 12.5px; color: var(--bone-2); font-weight: 400; }
.plate__row--sub { padding-top: 5px; margin-top: 4px; border-top: 1px solid rgba(230,221,196,.08); }

/* ---------- 底部手记条 ---------- */
.ledger {
  position: fixed; z-index: 20;
  left: 50%; transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b));
  width: min(420px, calc(100vw - 36px));
  display: flex; align-items: baseline; gap: 10px;
  padding: 7px 13px 8px;
  background: linear-gradient(180deg, rgba(20,28,23,.9), rgba(14,20,17,.92));
  border: 1px solid rgba(230, 221, 196, .09);
  border-left: 2px solid var(--copper);
  border-radius: 1px;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  pointer-events: none;
  overflow: hidden;
  box-shadow: 0 12px 30px -18px rgba(0,0,0,.9);
}
.ledger__no {
  font: 600 10.5px/1 var(--mono); letter-spacing: .1em;
  color: var(--copper-hi); flex: none;
}
.ledger__sci {
  font: italic 400 11.5px/1.3 var(--serif);
  color: var(--bone-2); flex: none; white-space: nowrap;
}
.ledger__note {
  font: 400 11.5px/1.3 var(--serif);
  color: var(--bone-dim); flex: 1 1 auto; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- 覆盖层：开始 / 结束 ---------- */
.veil {
  position: fixed; inset: 0; z-index: 30;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  /* 半透：开始时也要让玩家看见后面的荻丛和丘陵，先建立期待 */
  background: radial-gradient(64% 52% at 50% 48%, rgba(11,16,13,.5) 0%, rgba(11,16,13,.8) 100%);
  transition: opacity .34s var(--ease-out), visibility .34s;
}
.veil[hidden] { display: flex; opacity: 0; visibility: hidden; pointer-events: none; }

.card {
  width: min(330px, 100%);
  padding: 26px 26px 22px;
  text-align: left;
  background:
    linear-gradient(168deg, rgba(230,221,196,.05), rgba(230,221,196,.014)),
    var(--cab-2);
  border: 1px solid rgba(168, 129, 63, .4);
  border-radius: 1px;
  box-shadow: 0 30px 70px -26px rgba(0,0,0,.95);
  position: relative;
  animation: cardIn .44s var(--ease-snap) both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
.card::before {
  content: ''; position: absolute; inset: 4px;
  border: 1px solid rgba(168, 129, 63, .16); pointer-events: none;
}

.card__plate {
  font: 600 8.5px/1 var(--serif); letter-spacing: .3em; text-transform: uppercase;
  color: var(--copper); display: flex; justify-content: space-between;
}
.card h1 {
  margin: 14px 0 2px;
  font: 400 30px/1.1 var(--serif);
  letter-spacing: .16em; color: var(--bone);
  text-shadow: 0 2px 0 rgba(0,0,0,.55);
}
.card__sci {
  font: italic 400 12px/1.4 var(--serif);
  color: var(--bone-3); letter-spacing: .04em; margin: 0 0 15px;
}
.card__hr { height: 1px; background: rgba(230,221,196,.1); margin: 0 0 14px; }
.card p {
  margin: 0 0 9px;
  font: 400 12.5px/1.75 var(--serif);
  color: var(--bone-dim); letter-spacing: .03em;
}
.card p em { font-style: normal; color: var(--bone-2); }

.keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
.key {
  font: 500 8.5px/1 var(--serif); letter-spacing: .2em; text-transform: uppercase;
  color: var(--bone-3);
  border: 1px solid rgba(230,221,196,.14);
  border-radius: 1px; padding: 5px 8px;
}

.go {
  margin-top: 18px; width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 15px;
  background: rgba(168, 129, 63, .12);
  border: 1px solid var(--copper);
  border-radius: 1px;
  color: var(--copper-hi);
  font: 600 10px/1 var(--serif); letter-spacing: .28em; text-transform: uppercase;
  cursor: pointer;
  transition: background .18s var(--ease-out), transform .18s var(--ease-snap);
  -webkit-appearance: none; appearance: none;
}
.go:hover { background: rgba(168, 129, 63, .22); }
.go:active { transform: translateY(1px); }
.go span:last-child { letter-spacing: .05em; font-family: var(--mono); opacity: .8; }

.stats { display: flex; gap: 20px; margin: 2px 0 4px; }
.stat { flex: 1; }
.stat i {
  display: block; font: 400 8.5px/1 var(--serif); letter-spacing: .24em;
  text-transform: uppercase; color: var(--bone-3); font-style: normal; margin-bottom: 6px;
}
.stat b {
  font: 400 32px/1 var(--serif); color: var(--bone);
  font-variant-numeric: tabular-nums;
}
.stat--best b { color: var(--bone-2); }

/* 朱砂印戳 */
.stamp {
  position: absolute; top: 20px; right: 20px;
  width: 74px; height: 74px;
  display: grid; place-items: center;
  border: 2.5px solid var(--cinnabar);
  border-radius: 2px;
  color: var(--cinnabar);
  font: 600 9px/1.35 var(--serif); letter-spacing: .16em; text-align: center;
  transform: rotate(-9deg);
  opacity: .88;
  animation: stampIn .34s var(--ease-snap) both;
  animation-delay: .3s;
  pointer-events: none;
  mix-blend-mode: screen;
}
.stamp::after {
  content: ''; position: absolute; inset: 3px;
  border: 1px solid var(--cinnabar); opacity: .5;
}
@keyframes stampIn {
  from { opacity: 0; transform: rotate(-9deg) scale(2.1); }
  60%  { opacity: .95; transform: rotate(-9deg) scale(.94); }
  to   { opacity: .88; transform: rotate(-9deg) scale(1); }
}

.hint {
  margin-top: 13px;
  font: 400 9.5px/1.6 var(--serif); letter-spacing: .12em;
  color: var(--bone-faint); text-transform: uppercase;
}

@media (max-width: 420px) {
  .plate { width: 128px; padding: 9px 10px 8px; top: calc(12px + var(--safe-t)); right: 12px; }
  .plate__row b { font-size: 18px; }
  .card h1 { font-size: 26px; }
  .stat b { font-size: 27px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .stamp { animation: none; }
}
</style>
</head>
<body>

<div class="vignette" aria-hidden="true"></div>
<div class="grain" id="grain" aria-hidden="true"></div>

<div class="stage">
  <canvas id="cv" width="460" height="720" aria-label="候鸟志游戏画面"></canvas>
</div>

<!-- 标本标签卡 -->
<aside class="plate" aria-hidden="true">
  <div class="plate__no">Plate <b id="plateNo">I</b></div>
  <div class="plate__hr"></div>
  <div class="plate__row"><span>记录</span><b id="score">00</b></div>
  <div class="plate__row plate__row--sub"><span>最佳</span><b id="best">00</b></div>
</aside>

<!-- 手记条 -->
<footer class="ledger" aria-hidden="true">
  <span class="ledger__no" id="lgNo">No. 0000</span>
  <i class="ledger__sci" id="lgSci">Phragmites australis</i>
  <span class="ledger__note" id="lgNote">静候第一记</span>
</footer>

<!-- 开始 -->
<div class="veil" id="veilStart">
  <div class="card">
    <div class="card__plate"><span>Plate I</span><span>Notæ Avium</span></div>
    <h1>候 鸟 志</h1>
    <p class="card__sci">Aves in transitu — being field notes of a bird on passage</p>
    <div class="card__hr"></div>
    <p>荻丛的间距留一道缝，穗子一律朝内。你要做的只有一件事：<em>不要停</em>。</p>
    <p>每穿过一丛，标本柜的图版就往后翻一页。</p>
    <div class="keys">
      <span class="key">空格 / ↑ / 点击 / 触摸</span>
      <span class="key">P 暂停</span>
      <span class="key">M 静音</span>
    </div>
    <button class="go" id="btnStart" type="button"><span>开始记录</span><span>↵</span></button>
  </div>
</div>

<!-- 结束 -->
<div class="veil" id="veilEnd" hidden>
  <div class="card">
    <div class="stamp" id="stamp">最佳<br>RECORD</div>
    <div class="card__plate"><span>Plate <i id="endPlate" style="font-style:normal">I</i></span><span>Reliquum</span></div>
    <h1>停 羽</h1>
    <p class="card__sci" id="endSci">Phragmites australis</p>
    <div class="card__hr"></div>
    <div class="stats">
      <div class="stat"><i>本记</i><b id="endScore">0</b></div>
      <div class="stat stat--best"><i>最佳</i><b id="endBest">0</b></div>
    </div>
    <button class="go" id="btnRetry" type="button"><span>再记一次</span><span>↵</span></button>
    <div class="hint">空格重来</div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   1. 常量
   ============================================================ */
const W = 460, H = 720;          // 逻辑画布尺寸
const STEP = 1 / 120;            // 固定物理步长——手感跨刷新率一致的关键
const GRAVITY      = 2180;       // px/s²
const FLAP         = -442;       // 单次振翅给的瞬时速度
const MAX_FALL     = 830;

const GAP_H    = 168;            // 缝隙可视高度
/* 判定半径必须分方向，因为鸟不是个圆：
   垂直方向鸟身只有 ±13.9px 高，用 11 合适；
   水平方向它是侧影，喙前伸 22px —— 沿用 11 会让判定比视觉「迟到」11px，
   喙已经插进秆里却还不算撞。两个数都对着 drawBird 的实际路径量出来的。 */
const BIRD_R     = 11;   // 纵向判定半径
const BIRD_FRONT = 22;   // 横向判定半径（喙的前伸）

/* 缝的判定内缩。穗尖正好停在 gapTop/gapBot 上，鸟的视觉半高 14.1px，
   所以鸟心要离 gapTop 至少 14.1px 才算「看起来没碰」。这里留 80 → 判定线落在
   gapTop+15，比视觉宽 2px：擦边飞过去不算撞，但绝不会「看着有余量却撞死」。 */
const GAP_MARGIN = 80;
const SPACING  = 272;            // 丛间距基准
const SPEED_0  = 196;
const SPEED_MAX = 250;
const STALK_W  = 58;             // 荻束判定宽度

const ROMAN = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
               [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
function roman(n) {
  n = Math.max(0, Math.floor(n));
  if (n === 0) return '—';
  let out = '';
  for (const [v, s] of ROMAN) while (n >= v) { out += s; n -= v; }
  return out;
}

const SCI = [
  'Phragmites australis', 'Arundo donax', 'Miscanthus sinensis',
  'Phragmites karka', 'Arundo phragmites', 'Imperata cylindrica',
  'Typha latifolia', 'Phragmites commutatus'
];
const NOTES = [
  '静候第一记',
  '晨雾未散，荻丛间距稳定',
  '逆风而行，振幅约 4 Hz',
  '翼展 21 cm，尾羽略长',
  '过丛未惊，疑为当年个体',
  '日高，光斑掠过翅面',
  '水温 14°C，荻花已散',
  '风转东南，攀升加剧',
  '连过三丛，无停顿',
  '午后云量增，能见度下降',
  '落于茎尖，旋即复起',
  '北向群落，密度较密',
  '暮色四合，视野仅余轮廓',
  '小雪，候鸟南行',
  '茎秆含水，承重偏沉',
  '光斑偏西，影长逾身'
];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

/* 可复现的随机（同一局的地形可回放） */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   2. 音频：全部手写合成，零外部资源
   ============================================================ */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null;
  let windGain = null, windFilt = null, windLfo = null;
  let muted = false, ready = false;

  function makeNoise() {
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.85;
    master.connect(ctx.destination);
    noiseBuf = makeNoise();
    ready = true;
  }

  function unlock() {
    if (!ctx) init();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  function now() { return ctx.currentTime; }

  /* 一次性的包络振荡器，省得每次 new */
  function blip(o) {
    const { freq, to, type = 'sine', gain = 0.2, at = 0, dur = 0.15, curve = 0.0008 } = o;
    const t = now() + at;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (to != null) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + 0.02);
  }

  function noiseBurst(o) {
    const { freq = 1400, q = 2, gain = 0.2, at = 0, dur = 0.07, type = 'bandpass', to = null } = o;
    const t = now() + at;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    src.playbackRate.value = 0.8 + Math.random() * 0.5;
    const f = ctx.createBiquadFilter();
    f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (to != null) f.frequency.exponentialRampToValueAtTime(Math.max(60, to), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 1.2); src.stop(t + dur + 0.02);
  }

  return {
    unlock,
    get muted() { return muted; },
    toggleMute() {
      muted = !muted;
      if (master) master.gain.setTargetAtTime(muted ? 0 : 0.85, ctx.currentTime, 0.02);
      return muted;
    },
    get ready() { return ready; },

    /* 环境风声：常驻 filtered noise，截止频率被 LFO 缓慢推着走 */
    windStart() {
      if (!ctx || windGain) return;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      windFilt = ctx.createBiquadFilter();
      windFilt.type = 'lowpass'; windFilt.frequency.value = 460; windFilt.Q.value = 0.7;
      windGain = ctx.createGain(); windGain.gain.value = 0.0001;
      windLfo = ctx.createOscillator();
      const lfoG = ctx.createGain();
      windLfo.frequency.value = 0.13; lfoG.gain.value = 240;
      windLfo.connect(lfoG); lfoG.connect(windFilt.frequency);
      src.connect(windFilt); windFilt.connect(windGain); windGain.connect(master);
      src.start(); windLfo.start();
      windGain.gain.setTargetAtTime(0.05, ctx.currentTime, 0.9);
    },
    windStop() {
      if (!windGain) return;
      const g = windGain, f = windFilt, l = windLfo;
      g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.25);
      setTimeout(() => { try { l.stop(); } catch (e) {} windGain = null; windFilt = null; windLfo = null; }, 900);
    },
    /* 速度越快风声越亮 */
    windTune(k) {
      if (windFilt) windFilt.frequency.setTargetAtTime(400 + k * 620, ctx.currentTime, 0.3);
    },

    /* 振翅：一小撮带通噪声，像羽扇划开空气 */
    wing() {
      if (!ctx) return;
      noiseBurst({ freq: 1150 + Math.random() * 620, q: 1.9, gain: 0.15, dur: 0.062, to: 620 });
    },
    /* 穿丛：铜版画印刷钟那种清亮的八度双音 */
    pass() {
      if (!ctx) return;
      blip({ freq: 1760, type: 'sine',   gain: 0.16, dur: 0.16 });
      blip({ freq: 2640, type: 'sine',   gain: 0.075, dur: 0.13 });
      blip({ freq: 3520, type: 'sine',   gain: 0.026, dur: 0.08 });
      blip({ freq: 880,  type: 'triangle', gain: 0.05, dur: 0.1 });
    },
    /* 撞击：闷响 + 一下抽气 */
    hit() {
      if (!ctx) return;
      blip({ freq: 132, to: 52, type: 'sine', gain: 0.42, dur: 0.26 });
      blip({ freq: 210, to: 78, type: 'triangle', gain: 0.16, dur: 0.17 });
      noiseBurst({ freq: 900, to: 180, q: 0.8, gain: 0.2, dur: 0.13, type: 'lowpass' });
      this.windStop();
    },
    /* 落地：频率一路滑下去 */
    fall() {
      if (!ctx) return;
      blip({ freq: 430, to: 88, type: 'triangle', gain: 0.22, dur: 0.5 });
    },
    thud() {
      if (!ctx) return;
      blip({ freq: 96, to: 44, type: 'sine', gain: 0.3, dur: 0.2 });
      noiseBurst({ freq: 320, to: 90, q: 0.6, gain: 0.14, dur: 0.12, type: 'lowpass' });
    },
    /* 破纪录：三声上行 */
    record() {
      if (!ctx) return;
      [1318.5, 1760, 2637].forEach((f, i) =>
        blip({ freq: f, type: 'sine', gain: 0.15, at: i * 0.078, dur: 0.2 }));
    },
    /* 起步 */
    lift() {
      if (!ctx) return;
      noiseBurst({ freq: 700, to: 1900, q: 1.2, gain: 0.1, dur: 0.16, type: 'bandpass' });
      this.windStart();
    }
  };
})();

/* ============================================================
   3. 画布与视口
   ============================================================ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });

let dpr = 1, scale = 1;
function resize() {
  const st = document.querySelector('.stage');
  const s = Math.min(st.clientWidth / W, st.clientHeight / H);
  const cssW = Math.max(1, Math.floor(W * s));
  const cssH = Math.max(1, Math.floor(H * s));
  cv.style.width  = cssW + 'px';
  cv.style.height = cssH + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  scale = cv.width / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
// 旋转屏幕 / 移动端地址栏收放都会改可视高度，补一个观察器兜底
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.querySelector('.stage'));

/* ============================================================
   4. 预渲染资源
   远处的丘陵、云、纸纹、荻穗全部烘到离屏 canvas，
   每帧只做 drawImage —— 绝不在主循环里逐像素算噪声。
   ============================================================ */

/* --- 4.1 纸纹瓦片（叠在最上层的 .grain） --- */
(function grainTile() {
  const n = 128;
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  const d = img.data;
  for (let i = 0; i < n * n; i++) {
    // 中心值 128，叠加 ±26 的颗粒
    const v = 128 + (Math.random() * 2 - 1) * 26;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
    d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // 几条横向纤维
  g.globalAlpha = 0.10;
  g.strokeStyle = '#fff';
  for (let i = 0; i < 26; i++) {
    const y = Math.random() * n, x = Math.random() * n, len = 12 + Math.random() * 46;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (Math.random() * 2 - 1)); g.stroke();
  }
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* --- 4.2 丘陵剪影：1D value noise 出轮廓，一条路径烘成一张长图 --- */
function makeRidge(seed, w, h, baseY, amp, freq, alpha) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  // 预生成控制点，再用平滑插值连成起伏
  const N = Math.ceil(w / freq) + 2;
  const pts = new Array(N);
  for (let i = 0; i < N; i++) pts[i] = rnd();
  const at = x => {
    const f = x / freq, i = Math.floor(f), t = f - i;
    const a = pts[clamp(i, 0, N - 1)], b = pts[clamp(i + 1, 0, N - 1)];
    const s = t * t * (3 - 2 * t);
    return a + (b - a) * s;
  };
  g.beginPath();
  g.moveTo(0, h);
  for (let x = 0; x <= w; x += 2) {
    const y = baseY - (at(x) * 0.68 + at(x * 2.7 + 91) * 0.32) * amp;
    g.lineTo(x, y);
  }
  g.lineTo(w, h);
  g.closePath();
  g.fillStyle = `rgba(160, 178, 148, ${alpha})`;
  g.fill();
  // 山脊上一道更亮的勾边，让层次读得出来
  g.beginPath();
  for (let x = 0; x <= w; x += 2) {
    const y = baseY - (at(x) * 0.68 + at(x * 2.7 + 91) * 0.32) * amp;
    x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.strokeStyle = `rgba(230, 221, 196, ${alpha * 0.72})`;
  g.lineWidth = 1;
  g.stroke();
  return c;
}
const RIDGE_FAR  = makeRidge(1337, 1400, 260, 210, 120, 86, 0.11);
const RIDGE_NEAR = makeRidge(9021, 1400, 300, 250, 150, 128, 0.17);

/* --- 4.3 云：排线笔触，烘成 sprite 后横向循环 --- */
function makeCloud(seed, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  const lobes = 3 + Math.floor(rnd() * 3);
  g.lineCap = 'round';
  // 每一片云由若干条平行的短弧叠出体积，全是骨白低透明度
  for (let p = 0; p < 5; p++) {
    const off = p * 3.2;
    g.beginPath();
    for (let l = 0; l < lobes; l++) {
      const cx = w * (0.2 + 0.6 * (l / (lobes - 1)));
      const cy = h * (0.62 - Math.sin(l / (lobes - 1) * Math.PI) * 0.3) + off;
      const rx = w * (0.13 + rnd() * 0.1);
      const ry = h * (0.2 - Math.abs(l / (lobes - 1) - 0.5) * 0.14);
      g.moveTo(cx - rx, cy);
      g.bezierCurveTo(cx - rx, cy - ry * 1.7, cx + rx, cy - ry * 1.7, cx + rx, cy);
    }
    g.strokeStyle = `rgba(230, 221, 196, ${0.085 - p * 0.011})`;
    g.lineWidth = 2.8 - p * 0.3;
    g.stroke();
  }
  return c;
}
const CLOUDS = [makeCloud(11, 300, 90), makeCloud(77, 380, 104), makeCloud(303, 260, 78)];

/* --- 4.4 荻穗：程序化生成，穗子一律朝内 ---
   穗长必须小于 gap，否则它会伸进缝里，玩家看着以为过不去。 */
function makeSeedhead(seed) {
  const w = 56, h = 104;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  const cx = w / 2, top = 14, len = h - 26;
  g.lineCap = 'round';
  // 中轴
  g.beginPath(); g.moveTo(cx, top); g.lineTo(cx, top + len);
  g.strokeStyle = 'rgba(230,221,196,.82)'; g.lineWidth = 1.3; g.stroke();
  // 两侧斜毛：越往下越长，末端带一个小勾 —— 铜版画里芦花的画法
  const rows = 14;
  for (let i = 0; i < rows; i++) {
    const t = i / (rows - 1);
    const y = top + 10 + t * (len - 12);
    const l = (8 + Math.sin(t * Math.PI) * 16) * (0.78 + rnd() * 0.4);
    for (const s of [-1, 1]) {
      const droop = 0.5 + rnd() * 0.35;
      g.beginPath();
      g.moveTo(cx, y);
      g.quadraticCurveTo(cx + s * l * 0.62, y - l * 0.08, cx + s * l, y + l * droop);
      g.strokeStyle = `rgba(230,221,196,${(0.72 - t * 0.18) * (0.72 + rnd() * 0.45)})`;
      g.lineWidth = 1.1;
      g.stroke();
      // 末端小勾
      g.beginPath();
      g.moveTo(cx + s * l, y + l * droop);
      g.lineTo(cx + s * (l - 2.2), y + l * droop + 4);
      g.strokeStyle = `rgba(230,221,196,${(0.5 - t * 0.13)})`;
      g.lineWidth = 0.95;
      g.stroke();
    }
  }
  return c;
}
const SEEDS = [makeSeedhead(5), makeSeedhead(19), makeSeedhead(41), makeSeedhead(67)];

/* 荻穗的锚点 = sprite 真正有内容的顶端。
   实测 makeSeedhead 画出来的东西占内部 y=13..98：中轴从 y=14 起（带抗锯齿到 13），
   毛从 y=24 起。之前锚点填 24（= 毛的起点），于是整幅图往下偏了 11px：
   · 上半丛毛尖落到 gapTop-2.7，比缝口高 5.7px
   · 下半丛翻转后中轴反而伸出毛尖 9px，戳进缝里
   毛尖在内部 98，所以「锚点 → 毛尖」的距离是 85，用它来定茎长。 */
const SEED_ANCHOR = { x: 28, y: 13 };
const SEED_TIP = 85;             // 锚点(13) → 毛尖(98)

/* ============================================================
   5. 实体
   ============================================================ */
let rnd = mulberry32(1);

const bird = {
  x: 132, y: H * 0.44, vy: 0, ang: 0,
  flapT: 0,          // 振翅动画相位
  alive: true,
  grounded: false    // 触地音效只给一次
};

/* 一丛荻：一束上下对生的秆，穗子朝内 */
function makeClump(x, gapCY, gapH) {
  const n = 5;
  const stalks = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);                       // 0..1 横跨整束
    stalks.push({
      off: (f - 0.5) * (STALK_W - 11),          // 左右散布
      w: 8.5 + (1 - Math.abs(f - 0.5) * 2) * 4.5,
      bend: (rnd() - 0.5) * 11,
      hScale: 0.9 + rnd() * 0.14,
      seed: SEEDS[Math.floor(rnd() * SEEDS.length)],
      nodeOff: rnd() * 6
    });
  }
  return { x, gapCY, gapH, stalks, passed: false, sway: rnd() * 6.28 };
}

let clumps = [];
let score = 0, best = 0, speed = SPEED_0, dist = 0;
let state = 'idle';   // idle | play | dying | over
let hitstop = 0, deathT = 0, shake = 0;
let newRecord = false;

function resetRun() {
  rnd = mulberry32((Math.random() * 1e9) | 0);
  bird.x = 132; bird.y = H * 0.44; bird.vy = 0; bird.ang = -0.16; bird.flapT = 0; bird.alive = true; bird.grounded = false;
  // 预生成两丛，不把开局第一帧交给 physics 的补生成逻辑
  clumps = [];
  let x = W + 60, cy = H * 0.44;
  while (x < W + 420) { cy = spawnAt(x, cy); x += nextGap(); }
  score = 0; speed = SPEED_0; dist = 0;
  hitstop = 0; deathT = 0; shake = 0; newRecord = false;
  updateHud();
}

function nextGap() { return SPACING * (0.9 + rnd() * 0.22); }
/* 相邻两丛的缝心落差必须小于 gap 高度，否则会排出根本飞不过去的序列。
   难度上来后把落差从 88 收到 62：速度封顶时丛间距只剩 1.04s，
   而跨一档落差要两次振翅（约 0.8s），落差不收窄后期会变成运气游戏。
   上下两段的秆长之和恒为 374px（上 = gapCY-173，下 = 547-gapCY），
   所以缝心必须锁在 [244,474]：贴顶时上段会被压到只剩穗子悬在天花板。 */
function nextCY(prev) {
  const reach = 88 - Math.min(score, 45) * 0.58;
  return clamp(prev + (rnd() * 2 - 1) * reach, 244, 474);
}

function spawnAt(x, prevCY) {
  const gapH = GAP_H;
  const cy = nextCY(prevCY);
  clumps.push(makeClump(x, cy, gapH));
  return cy;
}

/* ============================================================
   6. 输入
   ============================================================ */
function flap() {
  if (state === 'idle' || state === 'over') { startRun(); return; }
  if (state === 'dying') return;
  if (state === 'paused') { setPaused(false); return; }
  bird.vy = FLAP;
  bird.flapT = 1;
  Sound.wing();
}
function press() { Sound.unlock(); flap(); }

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    e.preventDefault();
    if (state === 'idle' || state === 'over') Sound.unlock();
    if (state === 'over' && (e.code === 'Space' || e.code === 'Enter')) { startRun(); return; }
    flap();
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (state === 'play') setPaused(true);
    else if (state === 'paused') setPaused(false);
  } else if (e.code === 'KeyM') {
    Sound.unlock();
    const m = Sound.toggleMute();
    flashToast(m ? '静音' : '有声');
  }
}, { passive: false });

cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
cv.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('btnStart').addEventListener('click', () => { Sound.unlock(); startRun(); });
document.getElementById('btnRetry').addEventListener('click', () => { Sound.unlock(); startRun(); });

function setPaused(p) {
  if (p && state === 'play') { state = 'paused'; flashToast('暂停 · PAUSED'); }
  else if (!p && state === 'paused') { state = 'play'; updateHud(); }
}

/* ============================================================
   7. HUD（DOM 渲染，衬线字交给浏览器做抗锯齿）
   ============================================================ */
const el = {
  score:  document.getElementById('score'),
  best:   document.getElementById('best'),
  plate:  document.getElementById('plateNo'),
  lgNo:   document.getElementById('lgNo'),
  lgSci:  document.getElementById('lgSci'),
  lgNote: document.getElementById('lgNote'),
  endScore: document.getElementById('endScore'),
  endBest:  document.getElementById('endBest'),
  endPlate: document.getElementById('endPlate'),
  endSci:   document.getElementById('endSci'),
  stamp: document.getElementById('stamp'),
  vStart: document.getElementById('veilStart'),
  vEnd:   document.getElementById('veilEnd')
};
try { best = parseInt(localStorage.getItem('aves.best') || '0', 10) || 0; } catch (e) { best = 0; }

function pad2(n) { return String(n).padStart(2, '0'); }
function plateOf(n) { return roman(Math.floor(n / 5) + 1); }

function updateHud() {
  el.score.textContent = pad2(score);
  el.best.textContent  = pad2(best);
  el.plate.textContent = plateOf(score);
  el.lgNo.textContent  = 'No. ' + String(score).padStart(4, '0');
  el.lgSci.textContent = SCI[score % SCI.length];
  el.lgNote.textContent = NOTES[score % NOTES.length];
}
function hideVeil(id) { const v = document.getElementById(id); v.hidden = true; }
function showVeil(id, on) { const v = document.getElementById(id); v.hidden = !on; }

let toastT = 0;
function flashToast(txt) {
  el.lgNote.textContent = txt;
  toastT = 1.6;
}

function startRun() {
  resetRun();
  state = 'play';
  hideVeil('veilStart'); hideVeil('veilEnd');
  Sound.windStart();
  Sound.lift();
  bird.vy = FLAP;
  bird.flapT = 1;
}

function die() {
  if (state !== 'play') return;
  state = 'dying';
  deathT = 0;
  hitstop = 0.075;           // 顿帧——撞击的重量感全靠这一下
  shake = 7;
  bird.alive = false;
  Sound.hit();
}

function finishDeath() {
  state = 'over';
  if (score > best) { best = score; newRecord = true; Sound.record(); }
  else newRecord = false;
  try { localStorage.setItem('aves.best', String(best)); } catch (e) {}
  updateHud();
  el.endScore.textContent = String(score);
  el.endBest.textContent  = String(best);
  el.endPlate.textContent = plateOf(score);
  el.endSci.textContent   = SCI[Math.max(0, score - 1) % SCI.length];
  el.stamp.style.display = newRecord ? '' : 'none';
  showVeil('veilEnd', true);
}

/* ============================================================
   8. 物理
   ============================================================ */
function physics(dt) {
  if (state === 'play') {
    // 难度：每过一丛快一点，到 SPEED_MAX 封顶
    speed = Math.min(SPEED_MAX, SPEED_0 + score * 1.55);
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y  += bird.vy * dt;
    dist   += speed * dt;
    // 俯仰角直接跟速度走，不做插值——手感才跟手
    bird.ang = clamp(Math.atan2(bird.vy, 780), -0.52, 1.32);

    // 世界向左滚，鸟固定在左侧——街机的老规矩。
    // （反过来让鸟自己往右走的话，几秒后它就飞出画布了。）
    for (const c of clumps) c.x -= speed * dt;

    // 天花板
    if (bird.y - BIRD_R <= 0) { bird.y = BIRD_R; die(); return; }
    // 地板：触地音只给一次
    if (bird.y + BIRD_R >= H) {
      bird.y = H - BIRD_R;
      if (!bird.grounded) { bird.grounded = true; Sound.thud(); }
      die();
      return;
    }

    for (const c of clumps) {
      const half = STALK_W / 2;
      // 计分：整丛滑过鸟身即记一次
      if (!c.passed && c.x <= bird.x) {
        c.passed = true;
        score++;
        updateHud();
        Sound.pass();
        if (score % 10 === 0) Sound.windTune(Math.min(1, score / 30));
      }
      if (c.x + half < -80) continue;

      // 判定：只查横向重叠的丛，y 用矩形展开成等效圆
      // 横向用喙的前伸（BIRD_FRONT），纵向用鸟身高度（BIRD_R）：
      // 判定边界因此与「眼睛看到的障碍」对齐，不会出现
      // 「看着有余量却撞死」，也不会「喙插进秆里还活着」。
      if (Math.abs(bird.x - c.x) < half + BIRD_FRONT) {
        const top = c.gapCY - c.gapH / 2;
        const bot = c.gapCY + c.gapH / 2;
        const halfH = c.gapH / 2 - GAP_MARGIN;   // 内缩，判定比可视略宽
        if (bird.y - BIRD_R < top + halfH || bird.y + BIRD_R > bot - halfH) { die(); break; }
      }
    }

    // 回收身后的丛
    while (clumps.length && clumps[0].x < -120) clumps.shift();
    // 补足前方视野外的丛——不补的话丛会被回收干净，障碍就没了
    let last = clumps[clumps.length - 1];
    if (last) {
      let guard = 0;
      while (last.x < W + 460 && guard++ < 16) {
        spawnAt(last.x + nextGap(), last.gapCY);
        last = clumps[clumps.length - 1];
      }
    }
  } else if (state === 'dying') {
    deathT += dt;
    bird.vy = Math.min(bird.vy + GRAVITY * 0.72 * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    bird.ang = Math.min(bird.ang + 3.4 * dt, 1.45);
    if (bird.y + BIRD_R >= H) {
      bird.y = H - BIRD_R;
      if (deathT > 0.18) { Sound.thud(); finishDeath(); }
    }
  }
}

/* ============================================================
   9. 渲染
   ============================================================ */
function drawBackdrop(t) {
  // 柜底 + 抽屉格线
  ctx.fillStyle = '#0b110d';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(230,221,196,.07)';
  for (let y = 34; y < H; y += 68) ctx.fillRect(0, y, W, 1);
  ctx.fillStyle = 'rgba(230,221,196,.038)';
  for (let x = 0; x < W; x += 92) ctx.fillRect(x, 0, 1, H);

  // 远景丘陵（视差 0.14 / 0.34）
  const farX  = -(dist * 0.14) % RIDGE_FAR.width;
  const nearX = -(dist * 0.34) % RIDGE_NEAR.width;
  ctx.drawImage(RIDGE_FAR,  farX,  H - 258);
  ctx.drawImage(RIDGE_FAR,  farX + RIDGE_FAR.width,  H - 258);
  ctx.drawImage(RIDGE_NEAR, nearX, H - 292);
  ctx.drawImage(RIDGE_NEAR, nearX + RIDGE_NEAR.width, H - 292);

  // 云（视差 0.55），循环铺
  const cw = 760;
  const cx0 = -((dist * 0.55) % cw);
  for (let i = -1; i < 3; i++) {
    const c = CLOUDS[(i + 2) % CLOUDS.length];
    const wobble = Math.sin(t * 0.21 + i * 2.1) * 12;
    ctx.drawImage(c, cx0 + i * cw + 40, 58 + (i === 1 ? 46 : 0) + wobble);
  }
}

/* 一丛荻：上半向下垂 / 下半向上立，穗子都朝内 */
function drawClump(c, t) {
  const topY = 0, botY = H;
  const gapTop = c.gapCY - c.gapH / 2;
  const gapBot = c.gapCY + c.gapH / 2;
  // 整丛的轻微摇曳，越靠边越大
  const sway = Math.sin(t * 0.9 + c.sway) * 1.7;

  for (const s of c.stalks) {
    const sx = c.x + s.off;
    const seed = s.seed;
    /* head 显式给出「穗子接在茎的哪一端」：{x, y} 或 null。
       之前写死接在 toY，可上下半丛的 toY 语义正好相反——
       上半丛茎是 天花板(0) → 缝口(toY)，toY 恰好朝内；
       下半丛茎是 缝口(fromY) → 地板(toY)，toY 是地板。
       于是下半丛的穗子被接在 y=720 上、画在 646~720，离缝隙 200px，
       而判定线在 gapBot-3=441——视觉上还有一大片空档，判定却已经把你杀了。 */
    const drawStem = (fromY, toY, head) => {
      // 主茎：二次贝塞尔，尖端朝缝内弯
      const tipX = sx + s.bend + sway;
      const ctrlX = sx + s.bend * 0.3;
      const cy = (fromY + toY) / 2;
      const dx = tipX - sx, dy = toY - fromY;
      const len = Math.hypot(dx, dy) || 1;
      // 秆身：苔绿实心，必须从底色里跳出来（对比度 > 3:1，夜里也读得出边界）
      // 底端必须是平口：两条贝塞尔若直接相接，切线会交叉成 V 形尖角，
      // 上半丛就变成一排「獠牙」，和下半丛的平口不统一。
      ctx.beginPath();
      ctx.moveTo(sx - s.w / 2, fromY);
      ctx.quadraticCurveTo(ctrlX - s.w / 2, cy, tipX - s.w / 2, toY);
      ctx.lineTo(tipX + s.w / 2, toY);
      ctx.quadraticCurveTo(ctrlX + s.w / 2, cy, sx + s.w / 2, fromY);
      ctx.closePath();
      ctx.fillStyle = '#56735a';
      ctx.fill();
      // 秆的高光棱：铜版画里圆柱受光那一侧
      ctx.beginPath();
      ctx.moveTo(sx + s.w * 0.16, fromY);
      ctx.quadraticCurveTo(ctrlX + s.w * 0.16, cy, tipX + s.w * 0.1, toY);
      ctx.strokeStyle = 'rgba(230,221,196,.40)';
      ctx.lineWidth = 1.1;
      ctx.stroke();
      // 秆的暗侧轮廓
      ctx.beginPath();
      ctx.moveTo(sx - s.w / 2, fromY);
      ctx.quadraticCurveTo(ctrlX - s.w / 2, cy, tipX - s.w / 2, toY);
      ctx.lineTo(tipX + s.w / 2, toY);
      ctx.strokeStyle = 'rgba(230,221,196,.78)';
      ctx.lineWidth = 1.7;
      ctx.stroke();

      // 节：沿茎每隔一段一道短横
      const nSeg = Math.max(2, Math.floor(len / 40));
      ctx.strokeStyle = 'rgba(230,221,196,.55)';
      ctx.lineWidth = 1.3;
      for (let i = 1; i < nSeg; i++) {
        const t2 = i / nSeg + s.nodeOff * 0.01;
        if (t2 >= 1) break;
        // 贝塞尔上的点
        const mt = 1 - t2;
        const px = mt * mt * sx + 2 * mt * t2 * ctrlX + t2 * t2 * tipX;
        const py = mt * mt * fromY + 2 * mt * t2 * cy + t2 * t2 * toY;
        const w = s.w * 0.86;
        ctx.beginPath();
        ctx.moveTo(px - w / 2, py); ctx.lineTo(px + w / 2, py);
        ctx.stroke();
      }

      // 穗子：接在朝向缝口的那一端，穗尖正好停在缝口
      if (head) {
        const sc = s.hScale;
        ctx.save();
        ctx.translate(head.x, head.y);
        // 穗尖一律朝内：上丛朝下、下丛朝上
        const flip = head.y < c.gapCY ? 0 : Math.PI;
        ctx.rotate(flip + Math.sin(t * 1.25 + c.sway + s.off) * 0.05);
        ctx.scale(sc, sc);
        ctx.drawImage(seed, -SEED_ANCHOR.x, -SEED_ANCHOR.y);
        ctx.restore();
      }
    };

    // 上半：茎从天花板垂到缝口，穗接在缝口那端
    const upY = Math.max(26, gapTop - SEED_TIP * s.hScale + 3);
    drawStem(topY, upY, { x: sx + s.bend + sway, y: upY });
    // 下半：茎从缝口立到地板，穗接在缝口那端（茎的起点，不是终点）
    const loY = Math.min(botY - 26, gapBot + SEED_TIP * s.hScale - 3);
    drawStem(loY, botY, { x: sx, y: loY });
  }

  // 缝口不画任何标线。之前那道「判定边界高光」是错的：
  // 线宽只有 68px，比 5 根穗子簇（~103px）窄，浮在毛下面像根突兀的横杠；
  // 而且各根秆的 hScale 不同，线永远和「眼睛看到的穗尖」差着几像素，反而教玩家错判边界。
  // 穗尖本身就是最亮最密的部分（对比度 ~11:1），它就是边界；
  // 判定区每侧还比视觉多 21px 余量，按穗尖飞一定安全。
}

/* 鸟：骨白墨线的侧影，翅膀是两条弧 */
function drawBird(t) {
  const flap = bird.flapT;                       // 1 = 刚振翅
  const beat = Math.sin(t * 11 + (1 - flap) * 2.2);
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.ang);
  ctx.scale(1.14, 1.14);   // 视觉略大于判定半径：擦边而过看着像没撞，手感反而更宽容

  // 身体：水滴形
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.bezierCurveTo(12, -8.6, 1, -12.4, -8, -9.2);
  ctx.bezierCurveTo(-16, -6.4, -17, 4.4, -9, 8.4);
  ctx.bezierCurveTo(-1, 12.2, 10, 8.6, 15, 0);
  ctx.closePath();
  ctx.fillStyle = '#e6ddc4';
  ctx.fill();
  ctx.strokeStyle = 'rgba(14,20,17,.85)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 尾羽：三根长短不一的弧
  ctx.strokeStyle = '#c9bfa2';
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const a = -0.42 + i * 0.34;
    ctx.beginPath();
    ctx.moveTo(-10, 2.6);
    ctx.quadraticCurveTo(-17, 2.6 + Math.sin(a) * 8, -23 - i * 0.6, 1.4 + i * 3.4);
    ctx.lineWidth = 1.5 - i * 0.24;
    ctx.stroke();
  }

  // 翅膀：一条弧，随拍打上下翻
  const wUp = beat * 0.9;
  ctx.beginPath();
  ctx.moveTo(1, -3.4);
  ctx.quadraticCurveTo(-4 + beat * 3, -12 - wUp * 5, -15 + beat * 4, -6 - wUp * 7);
  ctx.strokeStyle = 'rgba(14,20,17,.9)';
  ctx.lineWidth = 2.1;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-1, -1.6);
  ctx.quadraticCurveTo(-5 + beat * 2.4, -9.6 - wUp * 4, -13 + beat * 3, -4.6 - wUp * 5.4);
  ctx.strokeStyle = 'rgba(201,191,162,.75)';
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // 头与喙
  ctx.beginPath();
  ctx.arc(7.4, -4.6, 4.5, 0, 6.2832);
  ctx.fillStyle = '#e6ddc4'; ctx.fill();
  ctx.strokeStyle = 'rgba(14,20,17,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
  // 喙：铜色
  ctx.beginPath();
  ctx.moveTo(11, -6.4); ctx.lineTo(19, -4.4); ctx.lineTo(11, -2.4); ctx.closePath();
  ctx.fillStyle = '#a8813f'; ctx.fill();
  // 眼
  ctx.beginPath();
  ctx.arc(8.4, -6.2, 1.15, 0, 6.2832);
  ctx.fillStyle = '#0e1411'; ctx.fill();

  ctx.restore();
}

function render(t) {
  ctx.save();
  if (shake > 0.05) {
    const s = shake;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  drawBackdrop(t);
  for (const c of clumps) {
    if (c.x > -100 && c.x < W + 120) drawClump(c, t);
  }
  drawBird(t);

  // 撞击时的朱砂闪一下
  if (hitstop > 0) {
    ctx.fillStyle = `rgba(184, 64, 44, ${Math.min(0.3, hitstop * 2.6)})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  // 顶/底的接地暗角，让「柜」的边界成立。范围必须够浅——
  // 下半丛的穗子（毛尖朝上，正指着缝）长在 540~640 这一带，
  // 暗角一重就把「穗尖朝内」这个唯一的边界信号压没了。
  const gTop = ctx.createLinearGradient(0, 0, 0, 42);
  gTop.addColorStop(0, 'rgba(9,13,11,.5)'); gTop.addColorStop(1, 'rgba(9,13,11,0)');
  ctx.fillStyle = gTop; ctx.fillRect(0, 0, W, 42);
  const gBot = ctx.createLinearGradient(0, H - 70, 0, H);
  gBot.addColorStop(0, 'rgba(9,13,11,0)'); gBot.addColorStop(1, 'rgba(9,13,11,.42)');
  ctx.fillStyle = gBot; ctx.fillRect(0, H - 70, W, 70);
  ctx.fillStyle = 'rgba(230,221,196,.10)';
  ctx.fillRect(0, H - 3, W, 3);
  ctx.fillRect(0, 0, W, 3);
}

/* 待机：鸟在原地轻晃，提示这里可以点 */
function idleFloat(t) {
  bird.y = H * 0.44 + Math.sin(t * 1.5) * 9;
  bird.ang = -0.1 + Math.sin(t * 1.5) * 0.07;
  bird.flapT = Math.max(0, bird.flapT - 0.06);
}

/* ============================================================
   10. 主循环：固定步长累加器
   ============================================================ */
let acc = 0, last = 0, T = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;          // 切标签页回来别一次跳完
  T += dt;

  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) updateHud();
  }

  if (state === 'play' || state === 'dying') {
    if (hitstop > 0) { hitstop -= dt; }
    else { acc += dt; let guard = 0; while (acc >= STEP && guard++ < 8) { physics(STEP); acc -= STEP; } }
    shake = Math.max(0, shake - dt * 26);
  } else {
    acc = 0;
  }
  if (state === 'idle') idleFloat(T);
  if (state === 'play') bird.flapT = Math.max(0, bird.flapT - dt * 3.4);

  render(T);
}

/* ---------- 启动 ---------- */
resize();
resetRun();
state = 'idle';
showVeil('veilStart', true);
requestAnimationFrame(frame);
</script>
</body>
